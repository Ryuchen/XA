# Local-only production-image verification. Use project name xa-local-validation.
# Merge after docker-compose.remote.yml; requires modern Docker Compose (!reset).
# Generate private credentials in .tools/local-validation.env; never use production credentials.
x-local-env: &local-env
  XA_LOCAL_VALIDATION: "true"
  DJANGO_DEBUG: "false"
  DJANGO_TRUST_PROXY: "false"
  DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,web
  DJANGO_MEDIA_BASE_URL: http://127.0.0.1:18080
  DJANGO_CACHE_URL: redis://redis:6379/3
  CORS_ALLOW_ALL_ORIGINS: "false"
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:18081,http://127.0.0.1:18082
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:18081,http://127.0.0.1:18082
  MYSQL_USER: ${MYSQL_USER:?local application database user required}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:?local application database password required}
  WECHAT_APPID: ""
  WECHAT_SECRET: ""
  WECHAT_MOCK_LOGIN: "false"
  KOOK_ENABLED: "false"
  KOOK_BOT_TOKEN: ""
  WECOM_DISPATCH_ENABLED: "false"
  WECOM_DISPATCH_WEBHOOK: ""
  REQUIRE_ORDER_EVIDENCE_IMAGES: "true"
  REQUIRE_RECHARGE_PROOF: "true"

services:
  db:
    environment:
      MYSQL_USER: ${MYSQL_USER:?local application database user required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?local application database password required}
  migrate:
    environment: *local-env
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py check_mysql_readiness &&
      python manage.py collectstatic --noinput"
  web:
    environment: *local-env
    ports: !reset []
    deploy:
      replicas: 2
  celery-worker:
    environment: *local-env
  celery-beat:
    environment: *local-env
  admin-web:
    ports: !reset []
  provider-h5:
    ports: !reset []
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18081:81"
      - "127.0.0.1:18082:82"
    volumes:
      - ./deploy/Caddyfile.local-validation:/etc/caddy/Caddyfile:ro
      - backend_media:/srv/media:ro
      - backend_static:/srv/static:ro
    depends_on:
      - web
      - admin-web
      - provider-h5
