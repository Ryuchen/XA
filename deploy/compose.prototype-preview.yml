services:
  prototype-preview:
    build:
      context: ..
      dockerfile: deploy/prototype-preview/Dockerfile
    image: xa-local/xa-prototype-preview:latest
    container_name: xa-prototype-preview
    restart: unless-stopped
    ports:
      - "127.0.0.1:28083:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 6
