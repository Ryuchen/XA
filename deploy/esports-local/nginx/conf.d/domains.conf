upstream esports_boss { server 127.0.0.1:14101; }
upstream esports_provider { server 127.0.0.1:14102; }
upstream esports_admin { server 127.0.0.1:14103; }
upstream esports_backend { server 127.0.0.1:18106; }

server {
    listen 127.0.0.1:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 127.0.0.1:80;
    server_name esports.club;
    location = / {
        error_page 404 /_entry-directory.html;
        return 404;
    }
    location = /_entry-directory.html {
        internal;
        alias /etc/nginx/conf.d/pages/entry-directory.html;
    }
    location ~ ^/entry/(sl|xa)/(boss|player)/$ {
        return 302 $scheme://$1.esports.club:$server_port/$2/;
    }
    location = /entry/admin/ { return 302 $scheme://admin.esports.club:$server_port/; }
    location / { return 404; }
}

server {
    listen 127.0.0.1:80;
    server_name sl.esports.club xa.esports.club;
    client_max_body_size 20m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location = / { absolute_redirect off; return 302 /boss/; }
    location = /boss { return 308 /boss/$is_args$args; }
    location = /player { return 308 /player/$is_args$args; }
    location /boss/ { proxy_pass http://esports_boss; }
    location /player/ { proxy_pass http://esports_provider; }
    location /api/ { proxy_pass http://esports_backend; }
    location /ws/ { proxy_pass http://esports_backend; }
    location /media/ { proxy_pass http://esports_backend; }
    # Existing shared brand URLs are absolute; both products use this asset.
    location = /brand.svg { proxy_pass http://esports_boss/boss/brand.svg; }
    location / { return 404; }
}

server {
    listen 127.0.0.1:80;
    server_name admin.esports.club;
    client_max_body_size 20m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    location /api/ { proxy_pass http://esports_backend; }
    location /ws/ { proxy_pass http://esports_backend; }
    location /media/ { proxy_pass http://esports_backend; }
    location / { proxy_pass http://esports_admin; }
}
