# 整合编排：一键启动「后端全栈 + 陪玩端 H5 + 运营后台」。
#   docker compose -f docker-compose.web.yml up -d --build
#
# 通过 include 复用根 docker-compose.yml 的后端全栈（db/redis/web/celery），
# 再叠加两个静态站点。后端 Web 服务名为 web，故各端反代目标为 http://web:8000。
#
# 老板端只交付原生微信小程序，不提供 H5 服务；需在微信开发者工具中打开。
include:
  - docker-compose.yml

services:
  provider-h5:
    build:
      context: .
      dockerfile: apps/provider-vue/Dockerfile
    image: xa-provider-h5:dev
    container_name: xa_provider_h5
    environment:
      BACKEND_ORIGIN: http://web:8000
    ports:
      - "8081:80"
    depends_on:
      - web

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    image: xa-admin-web:dev
    container_name: xa_admin_web
    environment:
      BACKEND_ORIGIN: http://web:8000
    ports:
      - "8080:80"
    depends_on:
      - web
