<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">第三张战绩截图示例凭证</title>
  <desc id="desc">用于原型演示的第三张战绩凭证，不是真实上传截图。</desc>
  <rect width="800" height="500" rx="24" fill="#f5f3ff"/>
  <rect x="32" y="32" width="736" height="436" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="64" y="92" font-family="sans-serif" font-size="26" font-weight="700" fill="#0f172a">对局战绩 · 第 3 张</text>
  <text x="64" y="124" font-family="sans-serif" font-size="16" fill="#64748b">示例凭证 · 非真实上传截图</text>
  <rect x="64" y="160" width="672" height="82" rx="10" fill="#1e3a8a"/>
  <text x="96" y="211" font-family="sans-serif" font-size="34" font-weight="700" fill="#ffffff">胜利</text>
  <text x="584" y="208" font-family="sans-serif" font-size="22" fill="#dbeafe">娱乐匹配</text>
  <text x="64" y="302" font-family="sans-serif" font-size="16" fill="#64748b">战绩</text>
  <text x="64" y="348" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">15 / 4 / 9</text>
  <text x="408" y="302" font-family="sans-serif" font-size="16" fill="#64748b">对局时长</text>
  <text x="408" y="348" font-family="sans-serif" font-size="34" font-weight="700" fill="#0f172a">24:08</text>
  <path d="M64 404H736" stroke="#e2e8f0"/>
  <text x="64" y="438" font-family="sans-serif" font-size="16" fill="#475569">用于演示逐张查看、删除与审核中预览</text>
</svg>
