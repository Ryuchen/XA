  const platform=config.globals.find(domain=>domain.id==='platform');
  document.querySelector('#platform-navigation').innerHTML='<div class="nav-section-label">平台管理</div>'+platform.features.map(([path,title])=>'<button class="global-link" data-page="'+path+'" aria-current="'+(state.currentPath===path?'page':'false')+'" title="'+title+'">'+svg(platform.icon)+'<span class="page-title">'+title+'</span></button>').join('');
  document.querySelector('#app').classList.toggle('is-collapsed',state.collapsed);document.querySelector('#app').classList.toggle('mobile-open',state.mobileOpen);
  document.querySelector('#collapse').setAttribute('aria-label',state.collapsed?'展开侧栏':'收起侧栏');document.querySelector('#collapse').title=state.collapsed?'展开侧栏':'收起侧栏';
}
function renderChrome(){
  const store=storeInfo[state.store];document.querySelector('#store-trigger-label').textContent=store.name;document.querySelector('#store-logo').src=store.logo;
  document.querySelector('#store-menu').innerHTML=Object.entries(storeInfo).map(([key,item])=>'<button class="store-option" data-store="'+key+'" aria-pressed="'+(state.store===key)+'"><img class="store-logo" src="'+item.logo+'" alt=""><span>'+item.name+'<small>'+(state.store===key?'当前门店':'切换演示')+'</small></span></button>').join('');
  document.querySelector('#store-menu').hidden=true;document.querySelector('#store-trigger').setAttribute('aria-expanded','false');document.title=store.name+' · 管理后台';
}
function ordersPage(){return '<div class="record-page"><header class="record-header"><div><h1>订单与派单</h1><p>管理陪玩订单与售后，操作前以详情复核结果为准。</p></div><button class="button-secondary" id="refresh-preview">'+svg('refresh')+'刷新</button></header><section class="filter-card" aria-label="订单筛选"><div class="queue-tabs" role="group" aria-label="订单工作队列">'+['全部订单','客服待派','处理中售后','礼物单'].map((label,index)=>'<button class="queue-tab" data-queue="'+label+'" aria-pressed="'+(index===0)+'">'+label+'</button>').join('')+'</div><form class="filter-form" id="order-filter"><div class="filter-row"><input class="control search-order" name="keyword" aria-label="搜索订单、老板或陪玩" placeholder="输入订单号、昵称、账号或手机号…"><input class="control search-customer" name="customer" aria-label="按老板账号搜索" placeholder="输入老板账号"><button class="button-primary" type="submit">查询</button><button class="button-secondary" type="button" id="advanced-toggle" aria-expanded="false" aria-controls="advanced-filters">'+svg('filter')+'更多筛选</button><button class="button-secondary button-quiet" type="button" id="clear-filters">清除条件</button></div><div class="advanced-grid" id="advanced-filters" hidden><label class="advanced-field">订单状态<select class="control" name="orderStatus"><option value="">全部状态</option></select></label><label class="advanced-field">支付状态<select class="control" name="paymentStatus"><option value="">全部状态</option></select></label><label class="advanced-field">下单日期<input class="control" name="createdDay" type="date"></label><label class="advanced-field">退款日期<input class="control" name="refundDay" type="date"></label></div><p class="draft-note" id="filter-note" role="status">原型仅演示筛选状态，不读取真实订单。</p></form></section><section class="table-card" aria-label="订单列表"><div class="table-heading"><div><h2>订单列表</h2><p>布局预览 · 未连接业务数据</p></div><button class="button-secondary" id="clear-table">清除全部条件</button></div><div class="table-scroll" tabindex="0" aria-label="订单表格，可横向滚动"><table class="record-table"><thead><tr><th>订单号 / 下单时间</th><th>老板</th><th>服务 / 陪玩</th><th>订单金额</th><th>订单状态</th><th>支付状态</th><th>接单路径</th><th>负责客服</th><th class="centered">结算 / 售后</th><th class="centered">操作</th></tr></thead><tbody><tr><td colspan="10" class="table-empty"><strong>不读取真实订单</strong><p>这里保留现有表格结构；正式环境按筛选条件读取数据。</p></td></tr></tbody></table></div><footer class="table-footer"><span>每页 10 条</span><span>支持横向滚动查看全部字段</span></footer></section></div>'}
function entryPage(feature){return '<section class="entry-card"><h1>'+feature.title+'</h1><p class="entry-note">该入口保留现有业务页面和权限。本选择稿只调整菜单位置，不重写页面功能。</p><dl><dt>所属模块</dt><dd>'+feature.domain+'</dd><dt>功能分组</dt><dd>'+feature.center+'</dd><dt>原路由</dt><dd>/'+feature.path+'</dd></dl></section>'}
function renderMain(){
  const feature=getFeature(state.currentPath);const domain=getDomain(state.activeDomain);const center=domain?.centers.find(item=>item.features.some(([path])=>path===feature.path));
  document.querySelector('#breadcrumbs').innerHTML='<span>'+storeInfo[state.store].name+'</span>'+svg('arrow')+(domain?'<span class="context-crumb">'+domain.title+'</span>'+svg('arrow'):'')+(center&&domain.centers.length>1?'<span class="context-crumb">'+center.title+'</span>'+svg('arrow'):'')+'<strong>'+feature.title+'</strong>';
  document.querySelector('#page-content').innerHTML=feature.path==='orders'?ordersPage():entryPage(feature);
}
function render(){renderNav();renderChrome();renderMain()}
function openSearch(){const input=document.querySelector('#search-input');input.value='';renderSearch('');document.querySelector('#search-dialog').showModal();input.focus()}
function renderSearch(query){const terms=query.trim().toLocaleLowerCase().split(/s+/).filter(Boolean);const results=allFeatures.filter(feature=>{const text=[feature.title,feature.domain,feature.center,feature.path,...(config.keywords[feature.path]||[])].join(' ').toLocaleLowerCase();return terms.every(term=>text.includes(term))});document.querySelector('#search-results').innerHTML=results.length?results.map(feature=>'<button class="search-result" data-page="'+feature.path+'">'+svg(feature.icon)+'<span class="feature-text"><strong>'+feature.title+'</strong><small>'+feature.domain+' · '+feature.center+' · /'+feature.path+'</small></span>'+svg('arrow')+'</button>').join(''):'<p class="empty">没有匹配的功能，请尝试其他关键词。</p>'}
function clearFilters(){const form=document.querySelector('#order-filter');if(form)form.reset();document.querySelectorAll('[data-queue]').forEach((button,index)=>button.setAttribute('aria-pressed',String(index===0)));const note=document.querySelector('#filter-note');if(note)note.textContent='已清除筛选条件；未发起业务查询。'}
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target)return;
  if(target.dataset.page){document.querySelectorAll('dialog[open]').forEach(dialog=>dialog.close());navigate(target.dataset.page);return}
  if(target.dataset.domain){const id=target.dataset.domain;if(state.collapsed){navigate(getDomain(id).centers[0].features[0][0]);return}if(state.activeDomain===id&&state.openDomain===id){state.openDomain=null;renderNav();return}navigate(getDomain(id).centers[0].features[0][0]);return}
  if(target.dataset.store){state.store=target.dataset.store;render();return}
  if(target.dataset.queue){document.querySelectorAll('[data-queue]').forEach(button=>button.setAttribute('aria-pressed',String(button===target)));document.querySelector('#filter-note').textContent='已切换到“'+target.dataset.queue+'”；仅演示队列状态，未发起业务查询。';return}
  switch(target.id){
    case 'store-trigger':{const menu=document.querySelector('#store-menu');menu.hidden=!menu.hidden;target.setAttribute('aria-expanded',String(!menu.hidden));break}
    case 'collapse':state.collapsed=!state.collapsed;renderNav();break;
    case 'mobile-toggle':state.mobileOpen=!state.mobileOpen;renderNav();break;
    case 'mobile-close':state.mobileOpen=false;renderNav();break;
    case 'search-open':openSearch();break;
    case 'search-close':document.querySelector('#search-dialog').close();break;
    case 'quick-dispatch':navigate('orders');history.replaceState(null,'','#/orders?dispatch=quick');document.querySelector('#quick-dialog').showModal();break;
    case 'quick-close':document.querySelector('#quick-dialog').close();history.replaceState(null,'','#/orders');break;
    case 'advanced-toggle':{const advanced=document.querySelector('#advanced-filters');advanced.hidden=!advanced.hidden;target.setAttribute('aria-expanded',String(!advanced.hidden));break}
    case 'clear-filters':case 'clear-table':clearFilters();break;
    case 'refresh-preview':notify('已刷新布局预览，未读取业务数据。');break;
  }
});
document.addEventListener('submit',event=>{if(event.target.id==='order-filter'){event.preventDefault();document.querySelector('#filter-note').textContent='筛选条件已更新；原型未发起订单查询。'}});
document.addEventListener('input',event=>{if(event.target.id==='search-input')renderSearch(event.target.value);if(event.target.closest('#order-filter'))document.querySelector('#filter-note').textContent='筛选输入已更改，请点击查询更新列表。'});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();openSearch()}if(event.key==='Escape'&&state.mobileOpen){state.mobileOpen=false;renderNav()}});
render();
</script></body></html>
