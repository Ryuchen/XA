name: xa

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ${XA_BACKEND_IMAGE:?immutable backend image required}
  init: true
  restart: unless-stopped
  logging: *logging
  mem_limit: 256m
  environment: &environment
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?secret required}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?hosts required}
    DJANGO_TRUST_PROXY: "true"
    DJANGO_MEDIA_BASE_URL: ${XA_PUBLIC_ORIGIN:?public origin required}
    CORS_ALLOW_ALL_ORIGINS: "false"
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?origins required}
    CSRF_TRUSTED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    MYSQL_DATABASE: xa_db
    MYSQL_USER: ${MYSQL_USER:?non-root application user required}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:?app database password required}
    MYSQL_HOST: db
    MYSQL_PORT: "3306"
    REDIS_HOST: redis
    DJANGO_CACHE_URL: ${DJANGO_CACHE_URL:-redis://redis:6379/3}
    WECHAT_APPID: ${WECHAT_APPID:?AppID required}
    WECHAT_SECRET: ${WECHAT_SECRET:?AppSecret required}
    WECHAT_MOCK_LOGIN: "false"
    REQUIRE_CLIENT_REQUEST_ID: "true"
    REQUIRE_ORDER_EVIDENCE_IMAGES: "true"
    REQUIRE_RECHARGE_PROOF: "true"
    KOOK_ENABLED: "false"
    WECOM_DISPATCH_ENABLED: "false"
  volumes:
    - backend_media:/app/media
    - backend_static:/app/staticfiles

services:
  kook-points:
    <<: *backend
    mem_limit: 192m
    command: python manage.py run_kook_points
    depends_on:
      migrate:
        condition: service_completed_successfully
  db:
    image: ${XA_MYSQL_IMAGE:?existing MySQL image required}
    restart: unless-stopped
    logging: *logging
    mem_limit: 640m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?existing root password required}
      MYSQL_DATABASE: xa_db
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=256M --max-connections=100
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
  redis:
    image: ${XA_REDIS_IMAGE:?existing Redis image required}
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    command: redis-server --appendonly yes --maxmemory 96mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
  migrate:
    <<: *backend
    restart: "no"
    mem_limit: 384m
    command: sh -c "python manage.py migrate --noinput && python manage.py check_mysql_readiness && python manage.py collectstatic --noinput"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    <<: *backend
    command: python -m config.serve -b 0.0.0.0 -p 8000 config.asgi:application
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/',timeout=5)"]
      interval: 20s
      timeout: 8s
      start_period: 45s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
  celery-worker:
    <<: *backend
    mem_limit: 320m
    command: celery -A config worker -l warning --concurrency=1
    depends_on:
      migrate:
        condition: service_completed_successfully
  celery-beat:
    <<: *backend
    mem_limit: 192m
    command: celery -A config beat -l warning
    depends_on:
      migrate:
        condition: service_completed_successfully
  admin-web:
    image: ${XA_NGINX_IMAGE:?pinned nginx image required}
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    volumes:
      - ./artifacts/admin:/usr/share/nginx/html:ro
      - ./deploy/frontend.conf:/etc/nginx/conf.d/default.conf:ro
  provider-h5:
    image: ${XA_NGINX_IMAGE}
    restart: unless-stopped
    logging: *logging
    mem_limit: 48m
    volumes:
      - ./artifacts/provider:/usr/share/nginx/html:ro
      - ./deploy/frontend.conf:/etc/nginx/conf.d/default.conf:ro
  gateway:
    image: ${XA_CADDY_IMAGE:?pinned Caddy image required}
    restart: unless-stopped
    logging: *logging
    mem_limit: 96m
    ports:
      - "80:80"
      - "8080:8080"
      - "8081:8081"
    environment:
      XA_SERVER_IP: ${XA_SERVER_IP:?server IP required}
    volumes:
      - ./deploy/Caddyfile.tencent-ip:/etc/caddy/Caddyfile:ro
      - backend_media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      admin-web:
        condition: service_started
      provider-h5:
        condition: service_started

volumes:
  mysql_data:
    external: true
    name: xa_mysql_data
  redis_data:
    external: true
    name: xa_redis_data
  backend_media:
    external: true
    name: xa_backend_media
  backend_static:
    external: true
    name: xa_backend_static
  caddy_data:
  caddy_config:
