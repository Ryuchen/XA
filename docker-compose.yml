services:
  db:
    image: mysql:8.0
    container_name: xa_django_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xa_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xa_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: xa_django_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
