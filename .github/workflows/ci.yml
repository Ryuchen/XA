name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build (apps/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm 版本统一读取根 package.json 的 packageManager，避免双重声明冲突。
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: node --test scripts/test-fund-request.cjs
      - run: node --test scripts/test-withdraw-ui.cjs
      - run: node --test scripts/test-coalesced-refresh.cjs
      - run: node --test scripts/test-realtime-clients.cjs
      - run: node --test scripts/test-auth-sessions.cjs
      - run: node --test scripts/test-private-media-clients.cjs
      - run: node --test scripts/test-native-core.cjs
      - run: node --test scripts/test-native-resource-budget.mjs
      - run: node --test scripts/test-release-config.mjs
      - run: node --test scripts/test-admin-build-config.mjs
      - run: node --test scripts/test-deploy-release.mjs
      - run: python3 scripts/test-managed-compose.py
      - run: pnpm run admin:build
      - run: pnpm run build:mini
      - run: pnpm run provider:build:h5
      - run: pnpm run style:check

  backend:
    name: Backend check (services/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --settings=config.test_settings --noinput
      - run: python manage.py test support orders.tests.test_release_flow orders.tests.test_release_websocket console.test_bootstrap --settings=config.migration_test_settings --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=config.migration_test_settings

  backend-mysql:
    name: MySQL migrations and concurrent business flows
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: xa-ci-ephemeral-only
          MYSQL_DATABASE: xa_test_release
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      XA_TEST_MYSQL_USER: root
      XA_TEST_MYSQL_PASSWORD: xa-ci-ephemeral-only
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check_mysql_readiness --settings=config.mysql_test_settings
      - run: python manage.py test --settings=config.mysql_test_settings --noinput
