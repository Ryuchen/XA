name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend build (apps/*)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # pnpm 版本统一读取根 package.json 的 packageManager，避免双重声明冲突。
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Client regression tests
        run: node --test scripts/test-*.cjs scripts/test-*.mjs apps/admin-web/tests/*.test.cjs apps/provider-miniapp/tests/*.cjs
      - run: python3 scripts/test-managed-compose.py
      - run: pnpm run admin:build
      - run: pnpm run build:mini
      - run: pnpm run provider:build:h5
      - run: pnpm run style:check

  backend:
    name: Backend check (services/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      # Backend integration tests execute the real frontend test drivers.
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py test --settings=config.test_settings --noinput --exclude-tag=filedb
      # Run concurrent live-server tests with independent SQLite connections.
      # Keep the payment simulator's in-memory-only safety boundary unchanged.
      - run: python manage.py test chat.test_staff_reply_recovery_http chat.test_staff_visibility_http orders.tests.test_native_frontend_http.NativeFrontendHTTPTest.test_native_self_order_direct_grab_uses_real_backend_contracts orders.tests.test_provider_flow_response_lost.ProviderFlowResponseLostTest.test_team_partial_evidence_response_loss --settings=config.ci_test_settings --noinput
        env:
          XA_CI_SQLITE_TEST_DB: ${{ runner.temp }}/xa-ci-backend-test.sqlite3
      - run: python manage.py test support orders.tests.test_release_flow orders.tests.test_release_websocket console.test_bootstrap --settings=config.migration_test_settings --noinput
      - run: python manage.py makemigrations --check --dry-run --settings=config.migration_test_settings

  backend-mysql:
    name: MySQL migrations and concurrent business flows
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: xa-ci-ephemeral-only
          MYSQL_DATABASE: xa_test_release
          MYSQL_USER: xa_test_ci
          MYSQL_PASSWORD: xa-ci-ephemeral-only
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      XA_TEST_MYSQL_USER: xa_test_ci
      XA_TEST_MYSQL_PASSWORD: xa-ci-ephemeral-only
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v6
      # The direct-payment simulation requires a non-root test-only account.
      # This account and its access exist only inside the ephemeral CI service.
      - name: Permit the isolated Django test database
        run: |
          docker exec -i -e MYSQL_PWD=xa-ci-ephemeral-only "${{ job.services.mysql.id }}" mysql -uroot <<'SQL'
          GRANT ALL PRIVILEGES ON `test\_xa\_test\_release`.* TO 'xa_test_ci'@'%';
          -- Race tests inspect lock waits using SHOW ENGINE INNODB STATUS.
          -- This global diagnostic privilege exists only in this disposable CI service.
          GRANT PROCESS ON *.* TO 'xa_test_ci'@'%';
          SQL
      # MySQL integration tests also invoke frontend drivers over real HTTP.
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python manage.py check_mysql_readiness --settings=config.mysql_test_settings
      - run: python manage.py test --settings=config.mysql_test_settings --noinput
