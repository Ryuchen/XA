name: Docker Hub images and remote deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME || 'ryuchen' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: xa-backend
            context: services/backend
            dockerfile: services/backend/Dockerfile
          - name: dispatch
            image: xa-admin-web
            context: .
            dockerfile: apps/admin-web/Dockerfile
          - name: provider
            image: xa-provider-h5
            context: .
            dockerfile: apps/provider-miniapp/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=XA ${{ matrix.name }}
            org.opencontainers.image.description=XA enterprise ${{ matrix.name }} service

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy Docker Hub images to remote server
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: xa-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}

      - name: Deploy by pulling immutable commit images
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DEPLOY_COMMIT: ${{ github.sha }}
          XA_DATABASE_MODE: ${{ vars.XA_DATABASE_MODE || 'embedded' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?}" "${DEPLOY_USER:?}" "${DOCKERHUB_TOKEN:?}"
          [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+([_.-][a-z0-9]+)*$ ]]
          [[ "$DEPLOY_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ "$XA_DATABASE_MODE" == embedded || "$XA_DATABASE_MODE" == managed ]]
          printf '%s' "$DOCKERHUB_TOKEN" | ssh -T -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"
          ssh -T -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "DOCKERHUB_NAMESPACE='$DOCKERHUB_USERNAME' XA_IMAGE_TAG='sha-$DEPLOY_COMMIT' DEPLOY_COMMIT='$DEPLOY_COMMIT' XA_DATABASE_MODE='$XA_DATABASE_MODE' bash -s" \
            < deploy/deploy-release.sh
