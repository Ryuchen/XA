<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息中心</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen bg-[var(--background)] text-[var(--foreground)]">
      <div class="mx-auto w-full max-w-md">

        <!-- ============ 顶部：iOS 状态栏 + 导航栏 (sticky) ============ -->
        <header class="sticky top-0 z-30 bg-[var(--background)]/85 backdrop-blur-xl">
          <!-- iOS 状态栏 -->
          <div class="flex h-11 items-center justify-between px-6 text-[13px] font-semibold tracking-[-0.01em] text-[var(--foreground)]">
            <span class="tabular-nums">9:41</span>
            <div class="flex items-center gap-1.5">
              <i data-lucide="signal" class="h-3.5 w-3.5"></i>
              <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
              <i data-lucide="battery-full" class="h-[18px] w-[18px]"></i>
            </div>
          </div>
          <!-- 导航栏：返回 + 标题 + 全部已读 -->
          <div class="relative flex h-11 items-center justify-between border-b border-[var(--border)] px-2">
            <button data-dom-id="nav-back" aria-label="返回" class="inline-flex h-9 items-center gap-0.5 rounded-lg pl-1 pr-2 text-[var(--primary)] transition-colors duration-150 hover:bg-[var(--primary)]/10 active:bg-[var(--primary)]/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
              <i data-lucide="chevron-left" class="h-6 w-6"></i>
              <span class="text-[15px]">返回</span>
            </button>
            <h1 class="pointer-events-none absolute left-1/2 -translate-x-1/2 text-[17px] font-semibold tracking-[-0.02em] text-[var(--foreground)]">消息</h1>
            <button data-dom-id="btn-read-all" class="group inline-flex h-9 items-center gap-1 rounded-lg px-2.5 text-[13px] font-medium text-[var(--primary)] transition-colors duration-150 hover:bg-[var(--primary)]/10 active:bg-[var(--primary)]/20 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
              <i data-lucide="check-check" class="h-4 w-4 transition-transform duration-150 group-hover:-translate-y-px motion-reduce:transform-none"></i>
              <span>全部已读</span>
            </button>
          </div>
        </header>

        <!-- ============ 内容区 ============ -->
        <div class="space-y-4 px-4 pb-[calc(env(safe-area-inset-bottom,0px)+24px)] pt-4">

          <!-- 分类入口宫格 -->
          <section aria-label="消息分类">
            <div class="grid grid-cols-4 gap-1 rounded-[var(--radius)] bg-[var(--card)] p-3 shadow-[var(--shadow-sm)]">
              <a href="#" data-dom-id="nav-cat-system" class="group flex flex-col items-center gap-1.5 rounded-2xl py-2 transition-colors duration-150 hover:bg-[var(--border)]/40 active:bg-[var(--border)]/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
                <span class="relative inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-[var(--primary)] text-[var(--primary-foreground)] transition-transform duration-150 group-hover:-translate-y-0.5 group-active:translate-y-0 motion-reduce:transform-none">
                  <i data-lucide="bell" class="h-6 w-6"></i>
                  <span class="absolute -right-1.5 -top-1.5 inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[var(--card)] bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">3</span>
                </span>
                <span class="max-w-full truncate text-[12px] text-[var(--foreground)]">系统通知</span>
              </a>
              <a href="#" data-dom-id="nav-cat-order" class="group flex flex-col items-center gap-1.5 rounded-2xl py-2 transition-colors duration-150 hover:bg-[var(--border)]/40 active:bg-[var(--border)]/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
                <span class="relative inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-[var(--success)] text-[var(--primary-foreground)] transition-transform duration-150 group-hover:-translate-y-0.5 group-active:translate-y-0 motion-reduce:transform-none">
                  <i data-lucide="package" class="h-6 w-6"></i>
                  <span class="absolute -right-1.5 -top-1.5 inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[var(--card)] bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">2</span>
                </span>
                <span class="max-w-full truncate text-[12px] text-[var(--foreground)]">订单消息</span>
              </a>
              <a href="#" data-dom-id="nav-cat-activity" class="group flex flex-col items-center gap-1.5 rounded-2xl py-2 transition-colors duration-150 hover:bg-[var(--border)]/40 active:bg-[var(--border)]/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
                <span class="relative inline-flex h-12 w-12 items-center justify-center rounded-2xl text-[var(--primary-foreground)] transition-transform duration-150 group-hover:-translate-y-0.5 group-active:translate-y-0 motion-reduce:transform-none" style="background-color: var(--chart-3);">
                  <i data-lucide="gift" class="h-6 w-6"></i>
                  <span class="absolute -right-1.5 -top-1.5 inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full border-2 border-[var(--card)] bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">5</span>
                </span>
                <span class="max-w-full truncate text-[12px] text-[var(--foreground)]">活动优惠</span>
              </a>
              <a href="#" data-dom-id="nav-cat-interact" class="group flex flex-col items-center gap-1.5 rounded-2xl py-2 transition-colors duration-150 hover:bg-[var(--border)]/40 active:bg-[var(--border)]/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--primary)] motion-reduce:transition-none">
                <span class="relative inline-flex h-12 w-12 items-center justify-center rounded-2xl text-[var(--primary-foreground)] transition-transform duration-150 group-hover:-translate-y-0.5 group-active:translate-y-0 motion-reduce:transform-none" style="background-color: var(--chart-4);">
                  <i data-lucide="heart" class="h-6 w-6"></i>
                </span>
                <span class="max-w-full truncate text-[12px] text-[var(--foreground)]">互动消息</span>
              </a>
            </div>
          </section>

          <!-- 会话 / 通知列表 -->
          <section aria-label="通知与会话">
            <h2 class="px-1 pb-1.5 text-[13px] font-medium text-[var(--muted-foreground)]">最近消息</h2>
            <div class="overflow-hidden rounded-[var(--radius)] bg-[var(--card)] shadow-[var(--shadow-sm)]">

              <!-- 未读：系统通知 -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--primary)] text-[var(--primary-foreground)]">
                  <i data-lucide="bell" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-b border-[var(--border)] py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-semibold tracking-[-0.01em] text-[var(--foreground)]">系统通知</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">您的账号已完成实名认证，可正常接单啦</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end gap-1.5">
                    <span class="text-[12px] tabular-nums text-[var(--muted-foreground)]">10:30</span>
                    <span class="inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">2</span>
                  </div>
                </div>
              </a>

              <!-- 未读：客服小安 -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--primary)] text-[var(--primary-foreground)]">
                  <i data-lucide="message-circle" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-b border-[var(--border)] py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-semibold tracking-[-0.01em] text-[var(--foreground)]">客服小安</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">您好，关于退款问题已为您加急处理～</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end gap-1.5">
                    <span class="text-[12px] tabular-nums text-[var(--muted-foreground)]">10:05</span>
                    <span class="inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">1</span>
                  </div>
                </div>
              </a>

              <!-- 已读：订单已完成 -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--success)] text-[var(--primary-foreground)]">
                  <i data-lucide="package" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-b border-[var(--border)] py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-normal text-[var(--foreground)]">订单已完成</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">王者荣耀双排陪玩订单已结算，去评价一下吧</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end">
                    <span class="text-[12px] text-[var(--muted-foreground)]">昨天</span>
                  </div>
                </div>
              </a>

              <!-- 未读：活动优惠 -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-[var(--primary-foreground)]" style="background-color: var(--chart-3);">
                  <i data-lucide="gift" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-b border-[var(--border)] py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-semibold tracking-[-0.01em] text-[var(--foreground)]">活动优惠</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">双十一狂欢｜全场大神陪玩低至 5 折起</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end gap-1.5">
                    <span class="text-[12px] text-[var(--muted-foreground)]">昨天</span>
                    <span class="inline-flex h-[18px] min-w-[18px] items-center justify-center rounded-full bg-[var(--destructive)] px-1 text-[10px] font-bold leading-none text-[var(--primary-foreground)]">5</span>
                  </div>
                </div>
              </a>

              <!-- 已读：互动消息 -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full text-[var(--primary-foreground)]" style="background-color: var(--chart-4);">
                  <i data-lucide="heart" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-b border-[var(--border)] py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-normal text-[var(--foreground)]">互动消息</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">「峡谷第一飞机」赞了你的陪玩评价</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end">
                    <span class="text-[12px] text-[var(--muted-foreground)]">周一</span>
                  </div>
                </div>
              </a>

              <!-- 已读：签到提醒（末项无分割线） -->
              <a href="#" data-dom-id="item-message" class="flex items-stretch gap-3 pl-4 transition-colors duration-150 hover:bg-[var(--border)]/25 active:bg-[var(--border)]/45 focus-visible:outline-none focus-visible:bg-[var(--border)]/30 motion-reduce:transition-none">
                <span class="my-3 inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-[var(--primary)] text-[var(--primary-foreground)]">
                  <i data-lucide="calendar-check" class="h-5 w-5"></i>
                </span>
                <div class="flex min-w-0 flex-1 items-center gap-3 py-3 pr-4">
                  <div class="min-w-0 flex-1">
                    <p class="truncate text-[15px] font-normal text-[var(--foreground)]">签到提醒</p>
                    <p class="truncate text-[13px] text-[var(--muted-foreground)]">连续签到 7 天，可领取限定头像框奖励</p>
                  </div>
                  <div class="flex shrink-0 flex-col items-end">
                    <span class="text-[12px] text-[var(--muted-foreground)]">周一</span>
                  </div>
                </div>
              </a>

            </div>
          </section>

        </div>
      </div>
    </main>
    <script>lucide.createIcons();</script>
