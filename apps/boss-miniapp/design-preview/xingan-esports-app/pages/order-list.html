<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased" style="background: var(--background);">
    <main class="mx-auto flex min-h-screen w-full max-w-[420px] flex-col" style="background: var(--background); color: var(--foreground);">

      <!-- iOS status bar -->
      <div class="flex h-11 shrink-0 items-center justify-between px-6 text-[15px] font-semibold tracking-tight" style="color: var(--foreground);">
        <span class="tabular-nums">9:41</span>
        <div class="flex items-center gap-1.5">
          <i data-lucide="signal" class="h-4 w-4"></i>
          <i data-lucide="wifi" class="h-4 w-4"></i>
          <i data-lucide="battery-full" class="h-5 w-5"></i>
        </div>
      </div>

      <!-- Sticky top navigation -->
      <header class="sticky top-0 z-30 border-b backdrop-blur-xl" style="border-color: var(--border); background: color-mix(in srgb, var(--background) 88%, transparent);">
        <div class="flex h-12 items-center justify-between px-2">
          <button data-dom-id="nav-back" aria-label="返回" class="inline-flex h-9 w-9 items-center justify-center rounded-full transition-colors duration-150 hover:bg-[var(--secondary)] active:scale-95 motion-reduce:transition-none" style="color: var(--foreground);">
            <i data-lucide="chevron-left" class="h-6 w-6"></i>
          </button>
          <h1 class="text-[17px] font-semibold tracking-tight">我的订单</h1>
          <button data-dom-id="link-service" aria-label="联系客服" class="inline-flex h-9 items-center gap-1 rounded-full px-3 text-[13px] font-medium transition-colors duration-150 hover:bg-[var(--secondary)] active:scale-95 motion-reduce:transition-none" style="color: var(--primary);">
            <i data-lucide="headphones" class="h-4 w-4"></i>
            <span>客服</span>
          </button>
        </div>

        <!-- Segmented status tabs -->
        <nav class="no-scrollbar flex items-center gap-1 overflow-x-auto px-3 pb-2" aria-label="订单状态筛选">
          <button data-tab-key="all" data-active="true" class="shrink-0 rounded-full px-4 py-1.5 text-[14px] font-semibold whitespace-nowrap transition-colors duration-150 data-[active=true]:text-[var(--primary-foreground)] motion-reduce:transition-none" style="background: var(--primary); color: var(--primary-foreground);">全部</button>
          <button data-tab-key="pending" class="shrink-0 rounded-full px-4 py-1.5 text-[14px] font-medium whitespace-nowrap transition-colors duration-150 hover:bg-[var(--secondary)] motion-reduce:transition-none" style="color: var(--muted-foreground);">待付款</button>
          <button data-tab-key="in-progress" class="shrink-0 rounded-full px-4 py-1.5 text-[14px] font-medium whitespace-nowrap transition-colors duration-150 hover:bg-[var(--secondary)] motion-reduce:transition-none" style="color: var(--muted-foreground);">进行中</button>
          <button data-tab-key="to-review" class="shrink-0 rounded-full px-4 py-1.5 text-[14px] font-medium whitespace-nowrap transition-colors duration-150 hover:bg-[var(--secondary)] motion-reduce:transition-none" style="color: var(--muted-foreground);">待评价</button>
          <button data-tab-key="completed" class="shrink-0 rounded-full px-4 py-1.5 text-[14px] font-medium whitespace-nowrap transition-colors duration-150 hover:bg-[var(--secondary)] motion-reduce:transition-none" style="color: var(--muted-foreground);">已完成</button>
        </nav>
      </header>

      <!-- Order card list -->
      <section class="flex flex-1 flex-col gap-3 px-4 py-4" aria-label="订单列表">

        <!-- Card 1 · 待付款 (orange) -->
        <article data-dom-id="card-order" class="group cursor-pointer rounded-[var(--radius)] border p-4 transition-transform duration-200 hover:-translate-y-0.5 active:scale-[0.99] motion-reduce:transition-none" style="background: var(--card); border-color: var(--border); box-shadow: var(--shadow-sm);">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-1.5">
              <i data-lucide="gamepad-2" class="h-4 w-4 shrink-0" style="color: var(--muted-foreground);"></i>
              <span class="truncate text-[14px] font-semibold">王者荣耀陪玩</span>
            </div>
            <span class="inline-flex h-6 shrink-0 items-center rounded-full px-2.5 text-[12px] font-semibold whitespace-nowrap" style="background: color-mix(in srgb, var(--chart-3) 14%, transparent); color: var(--chart-3);">待付款</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-start gap-3">
            <img src="../assets/player-1.jpg" alt="陪玩选手头像" class="h-14 w-14 shrink-0 rounded-full object-cover" style="border: 1px solid var(--border);">
            <div class="flex min-w-0 flex-1 flex-col gap-0.5">
              <p class="truncate text-[15px] font-semibold">王者荣耀 上分陪玩</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">3局 · 星耀段位 · 王者大神</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">¥30 / 局 × 3</p>
            </div>
            <span class="shrink-0 self-start text-[13px] tabular-nums" style="color: var(--muted-foreground);">×3</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-baseline gap-1">
              <span class="text-[13px]" style="color: var(--muted-foreground);">合计</span>
              <span class="text-[18px] font-bold tabular-nums" style="color: var(--chart-3);">¥90</span>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button class="inline-flex h-8 items-center rounded-lg border px-3.5 text-[13px] font-medium transition-colors duration-150 hover:bg-[var(--secondary)] active:scale-95 motion-reduce:transition-none" style="border-color: var(--border); color: var(--foreground);">取消订单</button>
              <button data-dom-id="btn-pay" class="inline-flex h-8 items-center rounded-lg px-4 text-[13px] font-semibold transition-all duration-150 hover:brightness-105 active:scale-95 motion-reduce:transition-none" style="background: var(--primary); color: var(--primary-foreground);">去支付</button>
            </div>
          </div>
        </article>

        <!-- Card 2 · 进行中 (blue) -->
        <article data-dom-id="card-order" class="group cursor-pointer rounded-[var(--radius)] border p-4 transition-transform duration-200 hover:-translate-y-0.5 active:scale-[0.99] motion-reduce:transition-none" style="background: var(--card); border-color: var(--border); box-shadow: var(--shadow-sm);">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-1.5">
              <i data-lucide="gamepad-2" class="h-4 w-4 shrink-0" style="color: var(--muted-foreground);"></i>
              <span class="truncate text-[14px] font-semibold">英雄联盟陪玩</span>
            </div>
            <span class="inline-flex h-6 shrink-0 items-center rounded-full px-2.5 text-[12px] font-semibold whitespace-nowrap" style="background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary);">进行中</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-start gap-3">
            <img src="../assets/player-2.jpg" alt="陪玩选手头像" class="h-14 w-14 shrink-0 rounded-full object-cover" style="border: 1px solid var(--border);">
            <div class="flex min-w-0 flex-1 flex-col gap-0.5">
              <p class="truncate text-[15px] font-semibold">英雄联盟 娱乐双排</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">2小时 · 钻石大神 · 语音陪玩</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">¥60 / 时 × 2</p>
            </div>
            <span class="shrink-0 self-start text-[13px] tabular-nums" style="color: var(--muted-foreground);">×2</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-baseline gap-1">
              <span class="text-[13px]" style="color: var(--muted-foreground);">合计</span>
              <span class="text-[18px] font-bold tabular-nums" style="color: var(--chart-3);">¥120</span>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button class="inline-flex h-8 items-center gap-1 rounded-lg border px-3 text-[13px] font-medium transition-colors duration-150 hover:bg-[var(--secondary)] active:scale-95 motion-reduce:transition-none" style="border-color: var(--border); color: var(--foreground);">
                <i data-lucide="message-circle" class="h-3.5 w-3.5"></i>
                <span>联系客服</span>
              </button>
              <button class="inline-flex h-8 items-center rounded-lg px-4 text-[13px] font-semibold transition-all duration-150 hover:brightness-105 active:scale-95 motion-reduce:transition-none" style="background: var(--primary); color: var(--primary-foreground);">查看进度</button>
            </div>
          </div>
        </article>

        <!-- Card 3 · 待评价 (green) -->
        <article data-dom-id="card-order" class="group cursor-pointer rounded-[var(--radius)] border p-4 transition-transform duration-200 hover:-translate-y-0.5 active:scale-[0.99] motion-reduce:transition-none" style="background: var(--card); border-color: var(--border); box-shadow: var(--shadow-sm);">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-1.5">
              <i data-lucide="gamepad-2" class="h-4 w-4 shrink-0" style="color: var(--muted-foreground);"></i>
              <span class="truncate text-[14px] font-semibold">和平精英陪玩</span>
            </div>
            <span class="inline-flex h-6 shrink-0 items-center rounded-full px-2.5 text-[12px] font-semibold whitespace-nowrap" style="background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success);">待评价</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-start gap-3">
            <img src="../assets/player-3.jpg" alt="陪玩选手头像" class="h-14 w-14 shrink-0 rounded-full object-cover" style="border: 1px solid var(--border);">
            <div class="flex min-w-0 flex-1 flex-col gap-0.5">
              <p class="truncate text-[15px] font-semibold">和平精英 四排竞技</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">4局 · 战神段位 · 技术大神</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">¥25 / 局 × 4</p>
            </div>
            <span class="shrink-0 self-start text-[13px] tabular-nums" style="color: var(--muted-foreground);">×4</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-baseline gap-1">
              <span class="text-[13px]" style="color: var(--muted-foreground);">合计</span>
              <span class="text-[18px] font-bold tabular-nums" style="color: var(--chart-3);">¥100</span>
            </div>
            <div class="flex shrink-0 items-center gap-2">
              <button class="inline-flex h-8 items-center rounded-lg border px-3.5 text-[13px] font-medium transition-colors duration-150 hover:bg-[var(--secondary)] active:scale-95 motion-reduce:transition-none" style="border-color: var(--border); color: var(--foreground);">联系客服</button>
              <button class="inline-flex h-8 items-center gap-1 rounded-lg px-4 text-[13px] font-semibold transition-all duration-150 hover:brightness-105 active:scale-95 motion-reduce:transition-none" style="background: var(--primary); color: var(--primary-foreground);">
                <i data-lucide="star" class="h-3.5 w-3.5"></i>
                <span>去评价</span>
              </button>
            </div>
          </div>
        </article>

        <!-- Card 4 · 已完成 (gray) -->
        <article data-dom-id="card-order" class="group cursor-pointer rounded-[var(--radius)] border p-4 transition-transform duration-200 hover:-translate-y-0.5 active:scale-[0.99] motion-reduce:transition-none" style="background: var(--card); border-color: var(--border); box-shadow: var(--shadow-sm);">
          <div class="flex items-center justify-between gap-2">
            <div class="flex min-w-0 items-center gap-1.5">
              <i data-lucide="gamepad-2" class="h-4 w-4 shrink-0" style="color: var(--muted-foreground);"></i>
              <span class="truncate text-[14px] font-semibold">王者荣耀陪玩</span>
            </div>
            <span class="inline-flex h-6 shrink-0 items-center rounded-full px-2.5 text-[12px] font-semibold whitespace-nowrap" style="background: var(--secondary); color: var(--muted-foreground);">已完成</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-start gap-3">
            <img src="../assets/player-1.jpg" alt="陪玩选手头像" class="h-14 w-14 shrink-0 rounded-full object-cover" style="border: 1px solid var(--border);">
            <div class="flex min-w-0 flex-1 flex-col gap-0.5">
              <p class="truncate text-[15px] font-semibold">王者荣耀 巅峰赛陪玩</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">5局 · 荣耀王者 · 巅峰大神</p>
              <p class="truncate text-[13px]" style="color: var(--muted-foreground);">¥40 / 局 × 5</p>
            </div>
            <span class="shrink-0 self-start text-[13px] tabular-nums" style="color: var(--muted-foreground);">×5</span>
          </div>

          <div class="my-3 h-px w-full" style="background: var(--border);"></div>

          <div class="flex items-center justify-between gap-3">
            <div class="flex min-w-0 items-baseline gap-1">
              <span class="text-[13px]" style="color: var(--muted-foreground);">合计</span>

            <div class="flex shrink-0 items-center gap-2">

          </div>
        </article>

      </section>

      <div class="shrink-0" style="height: env(safe-area-inset-bottom, 20px);"></div>

    </main>
