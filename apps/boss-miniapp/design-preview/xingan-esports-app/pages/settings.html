<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="min-h-screen w-full bg-[var(--secondary)] font-sans text-[var(--foreground)]">
      <div class="mx-auto w-full max-w-[430px] pb-[env(safe-area-inset-bottom)]">

        <!-- iOS status bar -->
        <div class="flex h-11 items-center justify-between px-6 text-[14px] font-semibold text-[var(--foreground)]">
          <span class="tabular-nums tracking-tight">9:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="signal" class="h-[15px] w-[15px]"></i>
            <i data-lucide="wifi" class="h-[15px] w-[15px]"></i>
            <i data-lucide="battery-full" class="h-[18px] w-[18px]"></i>
          </div>
        </div>

        <!-- Sticky navigation bar -->
        <header class="sticky top-0 z-30 border-b border-[var(--border)] bg-[var(--secondary)]/85 backdrop-blur-xl">
          <div class="flex h-11 items-center px-2">
            <button type="button" data-dom-id="nav-back" aria-label="返回个人中心"
              class="group inline-flex items-center gap-0.5 rounded-lg py-1 pl-1 pr-2 text-[var(--primary)] transition-opacity duration-150 hover:opacity-70 active:opacity-50 motion-reduce:transition-none">
              <i data-lucide="chevron-left" class="h-[22px] w-[22px]"></i>
              <span class="text-[16px] leading-none">个人中心</span>
            </button>
          </div>
        </header>

        <!-- Large title -->
        <div class="px-4 pt-2 pb-1">
          <h1 class="text-[32px] font-bold leading-tight tracking-[-0.02em] text-[var(--foreground)]" style="word-break: keep-all;">设置</h1>
        </div>

        <div class="px-4 pb-10">

          <!-- 账户分组 -->
          <section class="mt-4">
            <h2 class="px-1 pb-2 text-[13px] font-medium text-[var(--muted-foreground)]">账户</h2>
            <div class="overflow-hidden rounded-[16px] border border-[var(--border)] bg-[var(--card)]">
              <!-- 个人资料 -->
              <button type="button" data-dom-id="item-profile"
                class="flex w-full items-center gap-3.5 px-4 py-3.5 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-[var(--secondary)]">
                  <i data-lucide="user" class="h-7 w-7 text-[var(--muted-foreground)]"></i>
                </span>
                <span class="flex min-w-0 flex-1 flex-col">
                  <span class="truncate text-[17px] font-semibold leading-tight text-[var(--foreground)]">星野辰</span>
                  <span class="mt-0.5 truncate text-[13px] leading-tight text-[var(--muted-foreground)]">查看并编辑个人资料</span>
                </span>
                <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
              </button>
              <!-- 账号与安全 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="shield" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 border-t border-[var(--border)] py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">账号与安全</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
              <!-- 绑定手机 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="smartphone" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 border-t border-[var(--border)] py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">绑定手机</span>
                  <span class="shrink-0 truncate text-[15px] text-[var(--muted-foreground)]">138****6820</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
              <!-- 实名认证 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="badge-check" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 border-t border-[var(--border)] py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">实名认证</span>
                  <span class="shrink-0 truncate text-[15px] text-[var(--success)]">已认证</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
            </div>
          </section>

          <!-- 通用分组 -->
          <section class="mt-6">
            <h2 class="px-1 pb-2 text-[13px] font-medium text-[var(--muted-foreground)]">通用</h2>
            <div class="overflow-hidden rounded-[16px] border border-[var(--border)] bg-[var(--card)]">
              <!-- 消息通知 -->
              <div class="flex items-stretch px-4">
                <span class="flex items-center pr-3.5"><i data-lucide="bell" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <div class="flex min-w-0 flex-1 items-center gap-3 py-[11px]">
                  <span class="flex-1 truncate text-[16px] text-[var(--foreground)]">消息通知</span>
                  <label class="relative inline-flex h-[31px] w-[51px] shrink-0 cursor-pointer items-center" aria-label="消息通知开关">
                    <input type="checkbox" checked class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-[var(--border)] transition-colors duration-200 peer-checked:bg-[var(--success)] peer-focus-visible:ring-2 peer-focus-visible:ring-[var(--ring)] peer-focus-visible:ring-offset-2 motion-reduce:transition-none"></span>
                    <span class="absolute left-[2px] h-[27px] w-[27px] rounded-full bg-[var(--card)] shadow-sm transition-transform duration-200 peer-checked:translate-x-[20px] motion-reduce:transition-none"></span>
                  </label>
                </div>
              </div>
              <!-- 声音提醒 -->
              <div class="flex items-stretch px-4">
                <span class="flex items-center pr-3.5"><i data-lucide="volume-2" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-t border-[var(--border)] py-[11px]">
                  <span class="flex-1 truncate text-[16px] text-[var(--foreground)]">声音提醒</span>
                  <label class="relative inline-flex h-[31px] w-[51px] shrink-0 cursor-pointer items-center" aria-label="声音提醒开关">
                    <input type="checkbox" checked class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-[var(--border)] transition-colors duration-200 peer-checked:bg-[var(--success)] peer-focus-visible:ring-2 peer-focus-visible:ring-[var(--ring)] peer-focus-visible:ring-offset-2 motion-reduce:transition-none"></span>
                    <span class="absolute left-[2px] h-[27px] w-[27px] rounded-full bg-[var(--card)] shadow-sm transition-transform duration-200 peer-checked:translate-x-[20px] motion-reduce:transition-none"></span>
                  </label>
                </div>
              </div>
              <!-- 清除缓存 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="trash-2" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 border-t border-[var(--border)] py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">清除缓存</span>
                  <span class="shrink-0 truncate text-[15px] tabular-nums text-[var(--muted-foreground)]">12.5MB</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
              <!-- 深色模式 -->
              <div class="flex items-stretch px-4">
                <span class="flex items-center pr-3.5"><i data-lucide="moon" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-t border-[var(--border)] py-[11px]">
                  <span class="flex-1 truncate text-[16px] text-[var(--foreground)]">深色模式</span>
                  <label class="relative inline-flex h-[31px] w-[51px] shrink-0 cursor-pointer items-center" aria-label="深色模式开关">
                    <input type="checkbox" class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-[var(--border)] transition-colors duration-200 peer-checked:bg-[var(--success)] peer-focus-visible:ring-2 peer-focus-visible:ring-[var(--ring)] peer-focus-visible:ring-offset-2 motion-reduce:transition-none"></span>
                    <span class="absolute left-[2px] h-[27px] w-[27px] rounded-full bg-[var(--card)] shadow-sm transition-transform duration-200 peer-checked:translate-x-[20px] motion-reduce:transition-none"></span>
                  </label>
                </div>
              </div>
            </div>
          </section>

          <!-- 隐私分组 -->
          <section class="mt-6">
            <h2 class="px-1 pb-2 text-[13px] font-medium text-[var(--muted-foreground)]">隐私</h2>
            <div class="overflow-hidden rounded-[16px] border border-[var(--border)] bg-[var(--card)]">
              <!-- 隐私设置 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="lock" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">隐私设置</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
              <!-- 个性化推荐 -->
              <div class="flex items-stretch px-4">
                <span class="flex items-center pr-3.5"><i data-lucide="sliders-horizontal" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <div class="flex min-w-0 flex-1 items-center gap-3 border-t border-[var(--border)] py-[11px]">
                  <span class="flex-1 truncate text-[16px] text-[var(--foreground)]">个性化推荐</span>
                  <label class="relative inline-flex h-[31px] w-[51px] shrink-0 cursor-pointer items-center" aria-label="个性化推荐开关">
                    <input type="checkbox" checked class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-[var(--border)] transition-colors duration-200 peer-checked:bg-[var(--success)] peer-focus-visible:ring-2 peer-focus-visible:ring-[var(--ring)] peer-focus-visible:ring-offset-2 motion-reduce:transition-none"></span>
                    <span class="absolute left-[2px] h-[27px] w-[27px] rounded-full bg-[var(--card)] shadow-sm transition-transform duration-200 peer-checked:translate-x-[20px] motion-reduce:transition-none"></span>
                  </label>
                </div>
              </div>
              <!-- 黑名单管理 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="user-x" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 border-t border-[var(--border)] py-[15px]">
                  <span class="flex-1 truncate text-[16px] leading-none text-[var(--foreground)]">黑名单管理</span>
                  <span class="shrink-0 truncate text-[15px] tabular-nums text-[var(--muted-foreground)]">3 人</span>
                  <i data-lucide="chevron-right" class="h-[18px] w-[18px] shrink-0 text-[var(--muted-foreground)]"></i>
                </span>
              </button>
            </div>
          </section>

          <!-- 关于分组 -->
          <section class="mt-6">
            <h2 class="px-1 pb-2 text-[13px] font-medium text-[var(--muted-foreground)]">关于</h2>
            <div class="overflow-hidden rounded-[16px] border border-[var(--border)] bg-[var(--card)]">
              <!-- 关于我们 -->
              <button type="button"
                class="flex w-full items-stretch px-4 text-left transition-colors duration-150 hover:bg-[var(--accent)] active:bg-[var(--accent)] motion-reduce:transition-none">
                <span class="flex items-center pr-3.5"><i data-lucide="info" class="h-[21px] w-[21px] text-[var(--muted-foreground)]"></i></span>
                <span class="flex min-w-0 flex-1 items-center gap-2 py-[15px]">
