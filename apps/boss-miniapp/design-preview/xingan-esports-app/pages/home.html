<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto bg-[#F2F2F7] min-h-screen relative pb-[calc(64px+env(safe-area-inset-bottom,0px))]">

      <!-- 顶部蓝色渐变 Header -->
      <header class="text-white px-4 pt-2 pb-6 rounded-b-[--radius]" style="background: linear-gradient(135deg, #0A84FF 0%, #007AFF 55%, #0064D6 100%);">
        <!-- iOS 状态栏 -->
        <div class="flex items-center justify-between h-11 text-white">
          <span class="text-[15px] font-semibold tracking-tight tabular-nums">9:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="signal" class="w-[17px] h-[17px]"></i>
            <i data-lucide="wifi" class="w-[17px] h-[17px]"></i>
            <i data-lucide="battery-full" class="w-[22px] h-[22px]"></i>
          </div>
        </div>

        <!-- 品牌标题区 -->
        <div class="pt-2">
          <div class="flex items-center gap-2">
            <span class="inline-flex items-center justify-center w-9 h-9 rounded-xl bg-white/20 backdrop-blur">
              <i data-lucide="gamepad-2" class="w-5 h-5 text-white"></i>
            </span>
            <h1 class="text-[34px] leading-none font-bold tracking-tight">兴安电竞</h1>
          </div>
          <p class="mt-2 text-[15px] text-white/85 tracking-tight">专业电竞陪玩 · 高手在线</p>
        </div>

        <!-- 搜索框 -->
        <button class="mt-4 w-full flex items-center gap-2 h-11 px-4 rounded-full bg-white/20 backdrop-blur border border-white/25 text-left transition active:bg-white/25">
          <i data-lucide="search" class="w-[18px] h-[18px] text-white/90 shrink-0"></i>
          <span class="text-[15px] text-white/80 truncate">搜索游戏 / 陪玩</span>
        </button>
      </header>

      <!-- Banner 轮播 -->
      <section class="px-4 mt-4">
        <div class="relative rounded-[--radius] overflow-hidden shadow-[var(--shadow-sm)]">
          <img src="../assets/banner-hero.jpg" alt="兴安电竞陪玩活动 Banner" class="w-full h-[160px] object-cover" />
          <div class="absolute inset-x-0 bottom-0 h-16" style="background: linear-gradient(to top, rgba(0,0,0,0.45), transparent);"></div>
          <div class="absolute left-4 bottom-3 text-white">
            <p class="text-[17px] font-bold tracking-tight drop-shadow">新人首单立减 20 元</p>
            <p class="text-[12px] text-white/85 mt-0.5">大神陪玩，带你轻松上分</p>
          </div>
          <!-- 指示器 -->
          <div class="absolute right-4 bottom-4 flex items-center gap-1.5">
            <span class="block h-1.5 w-4 rounded-full" style="background:#007AFF;"></span>
            <span class="block h-1.5 w-1.5 rounded-full bg-white/60"></span>
            <span class="block h-1.5 w-1.5 rounded-full bg-white/60"></span>
          </div>
        </div>
      </section>

      <!-- 快捷入口区 -->
      <section class="px-4 mt-4 grid grid-cols-2 gap-3">
        <button class="relative overflow-hidden rounded-[--radius] p-4 text-left text-white shadow-[var(--shadow-sm)] transition active:scale-[0.98]" style="background: linear-gradient(135deg, #0A84FF 0%, #007AFF 100%);">
          <i data-lucide="crown" class="w-6 h-6 mb-6 text-white"></i>
          <p class="text-[16px] font-bold tracking-tight truncate">王者荣耀陪玩</p>
          <p class="text-[12px] text-white/85 mt-1 line-clamp-1">巅峰赛大神 带飞上王者</p>
          <i data-lucide="chevron-right" class="w-5 h-5 text-white/70 absolute right-3 bottom-3"></i>
        </button>
        <button class="relative overflow-hidden rounded-[--radius] p-4 text-left text-white shadow-[var(--shadow-sm)] transition active:scale-[0.98]" style="background: linear-gradient(135deg, #FF9F0A 0%, #FF9500 100%);">
          <i data-lucide="swords" class="w-6 h-6 mb-6 text-white"></i>
          <p class="text-[16px] font-bold tracking-tight truncate">英雄联盟陪玩</p>
          <p class="text-[12px] text-white/85 mt-1 line-clamp-1">王牌打野 双排稳赢</p>
          <i data-lucide="chevron-right" class="w-5 h-5 text-white/70 absolute right-3 bottom-3"></i>
        </button>
      </section>

      <!-- 热门陪玩 -->
      <section class="px-4 mt-7">
        <div class="flex items-end justify-between">
          <h2 class="text-[26px] font-bold tracking-tight" style="color: var(--foreground);">热门陪玩</h2>
          <a href="#" class="flex items-center gap-0.5 text-[13px] shrink-0" style="color: var(--muted-foreground);">
            查看全部 <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </a>
        </div>

        <div class="mt-3 flex flex-col gap-3">

          <!-- 选手卡片 1 -->
          <article class="flex gap-3 p-3 rounded-[--radius] shadow-[var(--shadow-sm)]" style="background: var(--card); border: 1px solid var(--border);">
            <img src="../assets/player-1.jpg" alt="峡谷之巅 头像" class="w-[76px] h-[76px] rounded-2xl object-cover shrink-0" />
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-center gap-2">
                <h3 class="text-[16px] font-semibold tracking-tight truncate" style="color: var(--foreground);">峡谷之巅</h3>
                <span class="inline-flex items-center h-5 px-2 rounded-md text-[11px] font-medium whitespace-nowrap shrink-0" style="background: var(--brand-50); color: var(--primary);">王者荣耀</span>
              </div>
              <div class="mt-1 flex items-center gap-3 text-[12px]" style="color: var(--muted-foreground);">
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color:#FF9500;fill:#FF9500;"></i>
                  <span class="font-medium" style="color: var(--foreground);">4.9</span>
                </span>
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <span class="w-1.5 h-1.5 rounded-full" style="background: var(--success);"></span>
                  <span style="color: var(--success);">在线</span>
                </span>
                <span class="whitespace-nowrap">接单 1200+</span>
              </div>
              <div class="mt-auto pt-2 flex items-end justify-between">
                <span class="text-[17px] font-bold tracking-tight" style="color:#FF9500;">¥30<span class="text-[12px] font-normal">/局</span></span>
                <button data-dom-id="player-order-btn" class="inline-flex items-center justify-center h-8 px-4 rounded-full text-[13px] font-semibold text-white whitespace-nowrap shadow-[var(--shadow-sm)] transition active:scale-95" style="background: var(--primary);">下单</button>
              </div>
            </div>
          </article>

          <!-- 选手卡片 2 -->
          <article class="flex gap-3 p-3 rounded-[--radius] shadow-[var(--shadow-sm)]" style="background: var(--card); border: 1px solid var(--border);">
            <img src="../assets/player-2.jpg" alt="暖心陪玩 头像" class="w-[76px] h-[76px] rounded-2xl object-cover shrink-0" />
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-center gap-2">
                <h3 class="text-[16px] font-semibold tracking-tight truncate" style="color: var(--foreground);">暖心陪玩</h3>
                <span class="inline-flex items-center h-5 px-2 rounded-md text-[11px] font-medium whitespace-nowrap shrink-0" style="background: var(--brand-50); color: var(--primary);">英雄联盟</span>
              </div>
              <div class="mt-1 flex items-center gap-3 text-[12px]" style="color: var(--muted-foreground);">
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color:#FF9500;fill:#FF9500;"></i>
                  <span class="font-medium" style="color: var(--foreground);">4.8</span>
                </span>
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <span class="w-1.5 h-1.5 rounded-full" style="background:#FF9500;"></span>
                  <span style="color:#FF9500;">忙碌</span>
                </span>
                <span class="whitespace-nowrap">接单 860+</span>
              </div>
              <div class="mt-auto pt-2 flex items-end justify-between">
                <span class="text-[17px] font-bold tracking-tight" style="color:#FF9500;">¥35<span class="text-[12px] font-normal">/局</span></span>
                <button class="inline-flex items-center justify-center h-8 px-4 rounded-full text-[13px] font-semibold text-white whitespace-nowrap shadow-[var(--shadow-sm)] transition active:scale-95" style="background: var(--primary);">下单</button>
              </div>
            </div>
          </article>

          <!-- 选手卡片 3 -->
          <article class="flex gap-3 p-3 rounded-[--radius] shadow-[var(--shadow-sm)]" style="background: var(--card); border: 1px solid var(--border);">
            <img src="../assets/player-3.jpg" alt="无敌上分 头像" class="w-[76px] h-[76px] rounded-2xl object-cover shrink-0" />
            <div class="flex-1 min-w-0 flex flex-col">
              <div class="flex items-center gap-2">
                <h3 class="text-[16px] font-semibold tracking-tight truncate" style="color: var(--foreground);">无敌上分</h3>
                <span class="inline-flex items-center h-5 px-2 rounded-md text-[11px] font-medium whitespace-nowrap shrink-0" style="background: var(--brand-50); color: var(--primary);">王者荣耀</span>
              </div>
              <div class="mt-1 flex items-center gap-3 text-[12px]" style="color: var(--muted-foreground);">
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <i data-lucide="star" class="w-3.5 h-3.5" style="color:#FF9500;fill:#FF9500;"></i>
                  <span class="font-medium" style="color: var(--foreground);">4.7</span>
                </span>
                <span class="inline-flex items-center gap-1 whitespace-nowrap">
                  <span class="w-1.5 h-1.5 rounded-full" style="background: var(--muted-foreground);"></span>
                  <span>离线</span>
                </span>
                <span class="whitespace-nowrap">接单 540+</span>
              </div>
              <div class="mt-auto pt-2 flex items-end justify-between">
                <span class="text-[17px] font-bold tracking-tight" style="color:#FF9500;">¥28<span class="text-[12px] font-normal">/局</span></span>
                <button class="inline-flex items-center justify-center h-8 px-4 rounded-full text-[13px] font-semibold text-white whitespace-nowrap shadow-[var(--shadow-sm)] transition active:scale-95" style="background: var(--primary);">下单</button>
              </div>
            </div>
          </article>

        </div>
      </section>

      <!-- 底部 TabBar -->
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-30 flex items-stretch justify-around h-16 pb-[env(safe-area-inset-bottom,0px)]" style="background: var(--card); border-top: 1px solid var(--border);">
        <a href="#" class="flex flex-col items-center justify-center gap-0.5 flex-1" style="color: var(--primary);">
          <i data-lucide="home" class="w-6 h-6"></i>
          <span class="text-[10px] font-medium">首页</span>
        </a>
        <a href="#" data-dom-id="nav-tab-category" class="flex flex-col items-center justify-center gap-0.5 flex-1" style="color: var(--muted-foreground);">
          <i data-lucide="layout-grid" class="w-6 h-6"></i>
          <span class="text-[10px]">分类</span>
        </a>
        <a href="#" data-dom-id="nav-tab-mine" class="flex flex-col items-center justify-center gap-0.5 flex-1" style="color: var(--muted-foreground);">
          <i data-lucide="user" class="w-6 h-6"></i>
          <span class="text-[10px]">我的</span>
        </a>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
