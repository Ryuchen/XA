<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的钱包</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="relative mx-auto min-h-screen w-full max-w-[375px] overflow-hidden bg-[var(--background-200)] pb-10 font-sans">

      <!-- 顶部蓝色渐变区（含 iOS 状态栏） -->
      <section class="relative z-0 rounded-b-[var(--radius)] pb-16 text-white" style="background: linear-gradient(135deg, var(--brand-400) 0%, var(--primary) 100%);">

        <!-- 1. iOS 状态栏 -->
        <div class="flex h-11 items-center justify-between px-5 text-[15px] font-semibold text-white">
          <span class="tracking-tight">9:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="signal" class="h-4 w-4"></i>
            <i data-lucide="wifi" class="h-4 w-4"></i>
            <i data-lucide="battery-full" class="h-5 w-5"></i>
          </div>
        </div>

        <!-- 页面标题行 -->
        <div class="flex items-center justify-between px-4 pt-1">
          <div class="flex items-center gap-2">
            <button type="button" data-dom-id="nav-back" aria-label="返回" class="grid h-9 w-9 place-items-center rounded-full text-white transition-transform active:scale-90 motion-reduce:transition-none -ml-2">
              <i data-lucide="chevron-left" class="h-6 w-6"></i>
            </button>
            <h1 class="text-xl font-bold tracking-tight text-white">我的钱包</h1>
          </div>
          <button type="button" aria-label="账单明细" class="grid h-9 w-9 place-items-center rounded-full bg-white/15 text-white transition-transform active:scale-95 motion-reduce:transition-none">
            <i data-lucide="receipt" class="h-[18px] w-[18px]"></i>
          </button>
        </div>

        <!-- 余额展示 -->
        <div class="px-4 pt-7 pb-2 text-center">
          <p class="text-sm text-white/80">账户余额</p>
          <p class="mt-2 whitespace-nowrap text-[46px] font-bold leading-none tracking-tight">
            <span class="align-top text-2xl font-semibold">¥</span>1,280.00
          </p>
          <p class="mt-3 text-xs text-white/75">累计充值 ¥3,500</p>
        </div>
      </section>

      <!-- 上浮白卡：充值 / 提现 入口 -->
      <div class="relative z-10 -mt-10 px-4">
        <div class="rounded-[var(--radius)] border border-[var(--border)] bg-[var(--card)] p-3 shadow-md">
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="cta-recharge" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-[var(--primary)] text-sm font-semibold text-white transition-transform active:scale-95 motion-reduce:transition-none">
              <i data-lucide="wallet" class="h-[18px] w-[18px]"></i>
              <span>余额充值</span>
            </button>
            <button type="button" id="cta-withdraw" class="flex h-12 items-center justify-center gap-2 rounded-xl bg-[var(--secondary)] text-sm font-semibold text-[var(--foreground)] transition-transform active:scale-95 motion-reduce:transition-none">
              <i data-lucide="banknote" class="h-[18px] w-[18px] text-[var(--primary)]"></i>
              <span>余额提现</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 3. 快捷数据卡（3 列） -->
      <div class="mx-4 mt-4 grid grid-cols-3 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--card)] p-4 shadow-sm">
        <div class="border-r border-[var(--border)] px-2 text-center">
          <p class="whitespace-nowrap text-lg font-bold text-[var(--success)]">¥520</p>
          <p class="mt-1 truncate text-xs text-[var(--text-400)]">本月收入</p>
        </div>
        <div class="border-r border-[var(--border)] px-2 text-center">
          <p class="whitespace-nowrap text-lg font-bold text-[var(--foreground)]">¥180</p>
          <p class="mt-1 truncate text-xs text-[var(--text-400)]">本月支出</p>
        </div>
        <div class="px-2 text-center">
          <p class="whitespace-nowrap text-lg font-bold text-[var(--foreground)]">3 张</p>
          <p class="mt-1 truncate text-xs text-[var(--text-400)]">优惠券</p>
        </div>
      </div>

      <!-- 4. 快速充值 -->
      <div class="mx-4 mt-4 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--card)] p-4 shadow-sm">
        <h2 class="text-base font-bold tracking-tight text-[var(--foreground)]">快速充值</h2>
        <div class="mt-3 grid grid-cols-3 gap-2.5">
          <button type="button" class="flex h-14 items-center justify-center rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-base font-semibold text-[var(--foreground)] transition-transform active:scale-95 motion-reduce:transition-none">¥50</button>
          <button type="button" aria-pressed="true" class="flex h-14 items-center justify-center rounded-xl border border-[var(--primary)] bg-[var(--brand-50)] text-base font-semibold text-[var(--primary)] transition-transform active:scale-95 motion-reduce:transition-none">¥100</button>
          <button type="button" class="flex h-14 items-center justify-center rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-base font-semibold text-[var(--foreground)] transition-transform active:scale-95 motion-reduce:transition-none">¥200</button>
          <button type="button" class="flex h-14 items-center justify-center rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-base font-semibold text-[var(--foreground)] transition-transform active:scale-95 motion-reduce:transition-none">¥500</button>
          <button type="button" class="flex h-14 items-center justify-center rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-base font-semibold text-[var(--foreground)] transition-transform active:scale-95 motion-reduce:transition-none">¥1000</button>
          <button type="button" class="flex h-14 items-center justify-center gap-1 rounded-xl border border-[var(--border)] bg-[var(--secondary)] text-sm font-semibold text-[var(--text-400)] transition-transform active:scale-95 motion-reduce:transition-none">
            <i data-lucide="pencil" class="h-4 w-4"></i>自定义
          </button>
        </div>
        <button type="button" id="cta-confirm-recharge" class="mt-4 h-12 w-full rounded-xl bg-[var(--primary)] text-base font-semibold text-white shadow-sm transition-transform active:scale-[0.98] motion-reduce:transition-none">立即充值</button>
      </div>

      <!-- 5. 交易记录 -->
      <div class="mx-4 mt-6 flex items-center justify-between">
        <h2 class="text-lg font-bold tracking-tight text-[var(--foreground)]">交易记录</h2>
        <button type="button" id="link-all-transactions" class="flex items-center gap-0.5 text-sm text-[var(--primary)] transition-transform active:scale-95 motion-reduce:transition-none">
          查看全部<i data-lucide="chevron-right" class="h-4 w-4"></i>
        </button>
      </div>

      <div class="mx-4 mt-3 overflow-hidden rounded-[var(--radius)] border border-[var(--border)] bg-[var(--card)] shadow-sm">
        <!-- 充值 -->
        <div class="flex items-center gap-3 border-b border-[var(--border)] px-4 py-3.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--state-success-surface)] text-[var(--success)]">
            <i data-lucide="arrow-down-left" class="h-[18px] w-[18px]"></i>
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-[var(--foreground)]">账户充值</p>
            <p class="mt-0.5 truncate text-xs text-[var(--text-400)]">2026-07-05 14:32</p>
          </div>
          <span class="whitespace-nowrap text-sm font-semibold text-[var(--success)]">+¥100</span>
        </div>
        <!-- 消费 -->
        <div class="flex items-center gap-3 border-b border-[var(--border)] px-4 py-3.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--secondary)] text-[var(--text-500)]">
            <i data-lucide="arrow-up-right" class="h-[18px] w-[18px]"></i>
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-[var(--foreground)]">王者荣耀陪玩</p>
            <p class="mt-0.5 truncate text-xs text-[var(--text-400)]">2026-07-04 21:15</p>
          </div>
          <span class="whitespace-nowrap text-sm font-semibold text-[var(--foreground)]">-¥30</span>
        </div>
        <!-- 提现 -->
        <div class="flex items-center gap-3 border-b border-[var(--border)] px-4 py-3.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--brand-50)] text-[var(--primary)]">
            <i data-lucide="banknote" class="h-[18px] w-[18px]"></i>
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-[var(--foreground)]">余额提现</p>
            <p class="mt-0.5 truncate text-xs text-[var(--text-400)]">2026-07-02 10:08</p>
          </div>
          <span class="whitespace-nowrap text-sm font-semibold text-[var(--foreground)]">-¥200</span>
        </div>
        <!-- 消费 -->
        <div class="flex items-center gap-3 px-4 py-3.5">
          <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-[var(--secondary)] text-[var(--text-500)]">
            <i data-lucide="arrow-up-right" class="h-[18px] w-[18px]"></i>
          </span>
          <div class="min-w-0 flex-1">
            <p class="truncate text-sm font-medium text-[var(--foreground)]">英雄联盟陪玩</p>
            <p class="mt-0.5 truncate text-xs text-[var(--text-400)]">2026-06-30 20:47</p>
          </div>
          <span class="whitespace-nowrap text-sm font-semibold text-[var(--foreground)]">-¥25</span>
        </div>
      </div>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
