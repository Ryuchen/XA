<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认下单</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto bg-[var(--background-200)] min-h-screen relative pb-24">

      <!-- Sticky top: iOS status bar + nav -->
      <div class="sticky top-0 z-20 bg-[var(--background-200)]/95 backdrop-blur">
        <!-- iOS status bar -->
        <div class="flex items-center justify-between px-6 h-11 text-[var(--foreground)]">
          <span class="text-[15px] font-semibold tracking-tight">9:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="signal" class="w-4 h-4"></i>
            <i data-lucide="wifi" class="w-4 h-4"></i>
            <i data-lucide="battery-full" class="w-6 h-6"></i>
          </div>
        </div>
        <!-- Nav bar -->
        <header class="flex items-center h-12 px-2">
          <button data-dom-id="nav-back" class="w-9 h-9 flex items-center justify-center rounded-full transition-transform active:scale-90 motion-reduce:transition-none" aria-label="返回">
            <i data-lucide="chevron-left" class="w-6 h-6 text-[var(--foreground)]"></i>
          </button>
          <h1 class="flex-1 text-center text-[17px] font-bold tracking-tight text-[var(--foreground)]">确认订单</h1>
          <div class="w-9 h-9 shrink-0"></div>
        </header>
      </div>

      <div class="px-4 pt-2 space-y-3">

        <!-- 1. 商品信息卡 -->
        <section class="bg-[var(--card)] border border-[var(--border)] p-3.5 shadow-[var(--shadow-sm)]" style="border-radius:var(--radius)">
          <div class="flex gap-3">
            <img src="../assets/player-1.jpg" alt="峡谷之巅陪玩头像" class="w-20 h-20 rounded-xl object-cover shrink-0 bg-[var(--muted)]">
            <div class="flex-1 min-w-0 flex flex-col">
              <h2 class="text-[15px] font-semibold text-[var(--foreground)] leading-snug line-clamp-2">王者荣耀 · 星耀段位专业陪玩</h2>
              <p class="mt-1 text-[12px] text-[var(--muted-foreground)] truncate">陪玩者：峡谷之巅</p>
              <p class="mt-0.5 text-[12px] text-[var(--muted-foreground)] truncate">王者荣耀 / 上分模式</p>
              <div class="mt-auto pt-2 flex items-center justify-between">
                <span class="text-[17px] font-bold text-[var(--chart-3)] whitespace-nowrap">¥30</span>
                <div class="flex items-center border border-[var(--border)] rounded-lg overflow-hidden shrink-0">
                  <button id="qty-minus" class="w-8 h-8 flex items-center justify-center text-[var(--muted-foreground)] transition-transform active:scale-90 motion-reduce:transition-none" aria-label="减少数量">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                  </button>
                  <span id="qty-value" class="w-8 text-center text-[15px] font-medium text-[var(--foreground)] border-x border-[var(--border)] leading-8">1</span>
                  <button id="qty-plus" class="w-8 h-8 flex items-center justify-center text-[var(--primary)] transition-transform active:scale-90 motion-reduce:transition-none" aria-label="增加数量">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- 2. 下单信息卡 -->
        <section class="bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-sm)] overflow-hidden" style="border-radius:var(--radius)">
          <button class="w-full flex items-center justify-between px-4 h-12 transition-colors active:bg-[var(--muted)] motion-reduce:transition-none">
            <span class="text-[15px] text-[var(--foreground)] shrink-0">游戏区服</span>
            <span class="flex items-center gap-1 min-w-0 ml-4">
              <span class="text-[15px] text-[var(--muted-foreground)] truncate">微信区 / 王者荣耀</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--muted-foreground)] shrink-0"></i>
            </span>
          </button>
          <div class="h-px bg-[var(--border)] ml-4"></div>
          <div class="flex items-center justify-between px-4 h-12">
            <label for="game-id" class="text-[15px] text-[var(--foreground)] shrink-0">游戏账号</label>
            <input id="game-id" type="text" placeholder="请输入游戏 ID" class="flex-1 ml-4 min-w-0 text-right text-[15px] text-[var(--foreground)] bg-transparent outline-none placeholder:text-[var(--muted-foreground)]">
          </div>
          <div class="h-px bg-[var(--border)] ml-4"></div>
          <div class="flex items-center justify-between px-4 h-12">
            <label for="phone" class="text-[15px] text-[var(--foreground)] shrink-0">联系方式</label>
            <input id="phone" type="tel" placeholder="请输入手机号" class="flex-1 ml-4 min-w-0 text-right text-[15px] text-[var(--foreground)] bg-transparent outline-none placeholder:text-[var(--muted-foreground)]">
          </div>
          <div class="h-px bg-[var(--border)] ml-4"></div>
          <button class="w-full flex items-center justify-between px-4 h-12 transition-colors active:bg-[var(--muted)] motion-reduce:transition-none">
            <span class="text-[15px] text-[var(--foreground)] shrink-0">预约时间</span>
            <span class="flex items-center gap-1 min-w-0 ml-4">
              <span class="text-[15px] text-[var(--muted-foreground)] truncate">立即开始</span>
              <i data-lucide="chevron-right" class="w-4 h-4 text-[var(--muted-foreground)] shrink-0"></i>
            </span>
          </button>
        </section>

        <!-- 3. 备注卡 -->
        <section class="bg-[var(--card)] border border-[var(--border)] p-4 shadow-[var(--shadow-sm)]" style="border-radius:var(--radius)">
          <h3 class="text-[15px] font-semibold text-[var(--foreground)]">订单备注</h3>
          <textarea rows="3" placeholder="填写对陪玩的要求（选填）" class="mt-2.5 w-full bg-transparent text-[14px] leading-relaxed text-[var(--foreground)] outline-none resize-none placeholder:text-[var(--muted-foreground)]"></textarea>
        </section>

        <!-- 4. 优惠券行 -->
        <section class="bg-[var(--card)] border border-[var(--border)] shadow-[var(--shadow-sm)] overflow-hidden" style="border-radius:var(--radius)">
          <button class="w-full flex items-center justify-between px-4 h-12 transition-colors active:bg-[var(--muted)] motion-reduce:transition-none">
            <span class="flex items-center gap-2 text-[15px] text-[var(--foreground)]">
              <i data-lucide="ticket-percent" class="w-[18px] h-[18px] text-[var(--chart-3)]"></i>
              优惠券
            </span>
            <span class="flex items-center gap-1 text-[15px] font-medium text-[var(--destructive)] shrink-0">
              -¥5
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </span>
          </button>
        </section>

        <!-- 5. 费用明细卡 -->
        <section class="bg-[var(--card)] border border-[var(--border)] p-4 shadow-[var(--shadow-sm)]" style="border-radius:var(--radius)">
          <div class="flex items-center justify-between text-[14px]">
            <span class="text-[var(--muted-foreground)]">商品金额</span>
            <span id="subtotal" class="text-[var(--foreground)] font-medium whitespace-nowrap">¥30</span>
          </div>
          <div class="flex items-center justify-between text-[14px] mt-2.5">
            <span class="text-[var(--muted-foreground)]">优惠</span>
            <span class="text-[var(--destructive)] font-medium whitespace-nowrap">-¥5</span>
          </div>
          <div class="h-px bg-[var(--border)] my-3"></div>
          <div class="flex items-center justify-between">
            <span class="text-[14px] text-[var(--foreground)]">实付款</span>
            <span id="total-detail" class="text-[18px] font-bold text-[var(--chart-3)] whitespace-nowrap">¥25</span>
          </div>
        </section>

      </div>

      <!-- 底部固定结算栏 -->
      <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] z-30 bg-[var(--card)]/95 backdrop-blur border-t border-[var(--border)] px-4 py-3 pb-[calc(env(safe-area-inset-bottom)+12px)]">
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0 flex items-baseline gap-1.5">
            <span class="text-[13px] text-[var(--muted-foreground)] shrink-0">合计</span>
            <span id="total-bar" class="text-[22px] font-bold text-[var(--chart-3)] whitespace-nowrap">¥25</span>
          </div>
          <button class="shrink-0 h-12 px-9 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] text-[16px] font-semibold tracking-tight transition-transform active:scale-[0.97] motion-reduce:transition-none" style="box-shadow:0 8px 20px -6px color-mix(in srgb, var(--primary) 55%, transparent)">
            提交订单
          </button>
        </div>
      </footer>

      <script>
        (function () {
          var unit = 30, coupon = 5, qty = 1;
          var qEl = document.getElementById('qty-value');
          var subEl = document.getElementById('subtotal');
          var totalDetail = document.getElementById('total-detail');
          var totalBar = document.getElementById('total-bar');
          function render() {
            var sub = unit * qty;
            var total = sub - coupon;
            qEl.textContent = qty;
            subEl.textContent = '¥' + sub;
            totalDetail.textContent = '¥' + total;
            totalBar.textContent = '¥' + total;
          }
          document.getElementById('qty-plus').addEventListener('click', function () {
            if (qty < 99) { qty++; render(); }
          });
          document.getElementById('qty-minus').addEventListener('click', function () {
            if (qty > 1) { qty--; render(); }
          });
        })();
      </script>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
