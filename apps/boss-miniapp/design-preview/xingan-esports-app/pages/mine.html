<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心</title>
    <style id="theme-vars">
/*
 * Pinguo design tokens
 * Brand: Pinguo
 * Domain: Consumer imaging product
 * Style: Restrained, elegant, Apple-inspired
 * Theme mode: light-dark
 * Source language: zh
 * Output language: en
 *
 * Color architecture (two layers):
 *   1. Primitive palette - six categories. brand / background / text / icon
 *      are each a 10-step scale (50 lightest to 900 darkest). state-success and
 *      state-error are functional colors anchored on Apple system colors.
 *      Anchors follow Apple Human Interface Guidelines system colors
 *      (System Blue #007AFF, System Green #34C759, System Red #FF3B30,
 *      system grays / label / background colors).
 *   2. Semantic tokens - :root (light) and .dark map roles onto primitives.
 *      Components and UI kits must only consume the semantic tokens below.
 */

/* @group-priority: brand, background, text, icon, state-success, state-error */

:root {
  /* ===== PRIMITIVE PALETTE ===== */

  /* brand */
  --brand-50: #e8f2ff;
  --brand-100: #cfe5ff;
  --brand-200: #9fcbff;
  --brand-300: #66abff;
  --brand-400: #2e8dff;
  --brand-500: #007aff; /* @primary */
  --brand-600: #0064d6;
  --brand-700: #004fad;
  --brand-800: #003b82;
  --brand-900: #00275a;

  /* background */
  --background-50: #ffffff;
  --background-100: #f7f7fa;
  --background-200: #f2f2f7;
  --background-300: #e5e5ea;
  --background-400: #d1d1d6;
  --background-500: #aeaeb2;
  --background-600: #8e8e93;
  --background-700: #3a3a3c;
  --background-800: #1c1c1e;
  --background-900: #000000;

  /* text */
  --text-50: #f5f5f7;
  --text-100: #e3e3e8;
  --text-200: #c7c7cc;
  --text-300: #aeaeb2;
  --text-400: #8e8e93;
  --text-500: #6e6e73;
  --text-600: #48484a;
  --text-700: #3c3c43;
  --text-800: #1d1d1f;
  --text-900: #000000;

  /* icon */
  --icon-50: #f5f5f7;
  --icon-100: #e5e5ea;
  --icon-200: #d1d1d6;
  --icon-300: #c7c7cc;
  --icon-400: #aeaeb2;
  --icon-500: #8e8e93;
  --icon-600: #6e6e73;
  --icon-700: #48484a;
  --icon-800: #2c2c2e;
  --icon-900: #1d1d1f;

  /* state-success */
  --state-success: #34c759; /* @primary */
  --state-success-dark: #30d158;
  --state-success-surface: #e9f9ee;
  --state-success-foreground: #ffffff;

  /* state-error */
  --state-error: #ff3b30; /* @primary */
  --state-error-dark: #ff453a;
  --state-error-surface: #ffecea;
  --state-error-foreground: #ffffff;

  /* ===== SEMANTIC ROLES ===== */

  /* semantic */
  --background: var(--background-50);
  --foreground: var(--text-800);
  --card: var(--background-50);
  --card-foreground: var(--text-800);
  --popover: var(--background-50);
  --popover-foreground: var(--text-900);

  --primary: var(--brand-500);
  --primary-foreground: var(--background-50);
  --secondary: var(--background-200);
  --secondary-foreground: var(--text-800);
  --muted: var(--background-200);
  --muted-foreground: var(--text-400);
  --accent: var(--background-100);
  --accent-foreground: var(--text-800);
  --destructive: var(--state-error);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-300);
  --input: var(--background-400);
  --ring: var(--brand-500);

  --icon: var(--icon-900);
  --icon-muted: var(--icon-500);

  /* chart */
  --chart-1: var(--state-success);
  --chart-2: var(--brand-500);
  --chart-3: #ff9500;
  --chart-4: #5856d6;
  --chart-5: #af52de;

  /* sidebar */
  --sidebar: var(--background-200);
  --sidebar-foreground: var(--text-800);
  --sidebar-primary: var(--brand-500);
  --sidebar-primary-foreground: var(--background-50);
  --sidebar-accent: var(--background-300);
  --sidebar-accent-foreground: var(--text-800);
  --sidebar-border: var(--background-300);
  --sidebar-ring: var(--brand-500);

  /* TYPOGRAPHY */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;
  --tracking-normal: 0em;

  /* RADIUS */
  --radius: 1.2rem;

  /* SHADOWS */
  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.04); /* Hairline */
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04); /* Subtle */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05), 0 1px 3px -1px rgba(0, 0, 0, 0.05); /* Card */
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.05); /* Raised */
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.05); /* Card Hover */
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.08), 0 4px 8px -4px rgba(0, 0, 0, 0.05); /* Float */
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.10), 0 8px 16px -8px rgba(0, 0, 0, 0.06); /* Overlay */
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.12); /* Modal */

  /* SPACING */
  --spacing: 0.24rem;
}

/* ===== SEMANTIC ROLES - dark (primitive palette inherited) ===== */
.dark {
  --background: var(--background-900);
  --foreground: var(--text-50);
  --card: var(--background-800);
  --card-foreground: var(--text-50);
  --popover: var(--background-700);
  --popover-foreground: var(--text-50);

  --primary: var(--brand-400);
  --primary-foreground: var(--background-900);
  --secondary: var(--background-800);
  --secondary-foreground: var(--text-50);
  --muted: var(--background-800);
  --muted-foreground: var(--text-400);
  --accent: var(--background-700);
  --accent-foreground: var(--text-50);
  --destructive: var(--state-error-dark);
  --destructive-foreground: var(--state-error-foreground);
  --success: var(--state-success-dark);
  --success-foreground: var(--state-success-foreground);
  --border: var(--background-700);
  --input: var(--background-700);
  --ring: var(--brand-400);

  --icon: var(--icon-50);
  --icon-muted: var(--icon-500);

  --chart-1: var(--state-success-dark);
  --chart-2: var(--brand-400);
  --chart-3: #ff9f0a;
  --chart-4: #5e5ce6;
  --chart-5: #bf5af2;

  --sidebar: var(--background-800);
  --sidebar-foreground: var(--text-50);
  --sidebar-primary: var(--brand-400);
  --sidebar-primary-foreground: var(--background-900);
  --sidebar-accent: var(--background-700);
  --sidebar-accent-foreground: var(--text-50);
  --sidebar-border: var(--background-700);
  --sidebar-ring: var(--brand-400);

  --shadow-2xs: 0 1px 2px -1px rgba(0, 0, 0, 0.30);
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.30);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.36), 0 1px 3px -1px rgba(0, 0, 0, 0.36);
  --shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.40), 0 1px 2px -1px rgba(0, 0, 0, 0.36);
  --shadow-md: 0 4px 8px -2px rgba(0, 0, 0, 0.44), 0 2px 4px -2px rgba(0, 0, 0, 0.36);
  --shadow-lg: 0 8px 24px -8px rgba(0, 0, 0, 0.50), 0 4px 8px -4px rgba(0, 0, 0, 0.40);
  --shadow-xl: 0 16px 40px -10px rgba(0, 0, 0, 0.55), 0 8px 16px -8px rgba(0, 0, 0, 0.44);
  --shadow-2xl: 0 24px 64px -12px rgba(0, 0, 0, 0.60);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-foreground: var(--card-foreground);
  }
  @layer base {
    body { background: var(--card-background); color: var(--card-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main class="max-w-[375px] mx-auto bg-[var(--muted)] min-h-screen relative pb-20">

      <!-- Blue gradient header (includes iOS status bar) -->
      <header class="relative px-4 pt-2 pb-16 text-[var(--primary-foreground)]"
              style="background: linear-gradient(135deg, var(--brand-400) 0%, var(--primary) 100%);">

        <!-- iOS status bar -->
        <div class="flex items-center justify-between h-11">
          <span class="text-[15px] font-semibold tracking-tight">9:41</span>
          <div class="flex items-center gap-1.5">
            <i data-lucide="signal" class="w-4 h-4"></i>
            <i data-lucide="wifi" class="w-4 h-4"></i>
            <i data-lucide="battery-full" class="w-5 h-5"></i>
          </div>
        </div>

        <!-- User identity row -->
        <div class="flex items-center gap-4 mt-4">
          <img src="../assets/player-1.jpg" alt="用户头像"
               class="w-[68px] h-[68px] rounded-full object-cover shrink-0 border-2 border-[var(--background-50)] shadow-[var(--shadow-md)]">
          <div class="min-w-0 flex-1">
            <h1 class="text-[26px] leading-tight font-bold tracking-tight truncate">电竞玩家</h1>
            <p class="text-[13px] opacity-80 truncate mt-0.5">ID: 88888888</p>
            <span class="inline-flex items-center gap-1 h-6 mt-2 px-2.5 rounded-lg text-[12px] font-semibold whitespace-nowrap text-[var(--text-800)]"
                  style="background: var(--chart-3);">
              <i data-lucide="crown" class="w-3.5 h-3.5"></i>普通会员
            </span>
          </div>
          <button aria-label="设置" class="shrink-0 self-start w-8 h-8 inline-flex items-center justify-center rounded-full transition-colors hover:bg-[var(--primary-foreground)]/15 active:bg-[var(--primary-foreground)]/25">
            <i data-lucide="settings" class="w-5 h-5"></i>
          </button>
        </div>
      </header>

      <!-- Wallet card (floats over gradient) -->
      <section class="relative -mt-10 mx-4 bg-[var(--card)] rounded-[var(--radius)] border border-[var(--border)] shadow-[var(--shadow-md)]">
        <div class="grid grid-cols-3 divide-x divide-[var(--border)]">
          <button id="entry-wallet" data-dom-id="entry-wallet" class="flex flex-col items-center justify-center py-5 transition-colors active:bg-[var(--muted)]">
            <span class="text-[20px] font-bold tracking-tight whitespace-nowrap" style="color: var(--chart-3);">¥1,280</span>
            <span class="text-[12px] text-[var(--muted-foreground)] mt-1">余额</span>
          </button>
          <button class="flex flex-col items-center justify-center py-5 transition-colors active:bg-[var(--muted)]">
            <span class="text-[20px] font-bold tracking-tight text-[var(--foreground)] whitespace-nowrap">3 张</span>
            <span class="text-[12px] text-[var(--muted-foreground)] mt-1">优惠券</span>
          </button>
          <button class="flex flex-col items-center justify-center py-5 transition-colors active:bg-[var(--muted)]">
            <span class="text-[20px] font-bold tracking-tight text-[var(--foreground)] whitespace-nowrap">520</span>
            <span class="text-[12px] text-[var(--muted-foreground)] mt-1">积分</span>
          </button>
        </div>
      </section>

      <!-- My orders card -->
      <section class="mx-4 mt-4 bg-[var(--card)] rounded-[var(--radius)] border border-[var(--border)] shadow-[var(--shadow-sm)] p-4">
        <div class="flex items-center justify-between">
          <h2 class="text-[16px] font-bold tracking-tight text-[var(--foreground)] truncate">我的订单</h2>
          <a href="#" id="link-order-all" data-dom-id="link-order-all" class="shrink-0 inline-flex items-center gap-0.5 text-[13px] text-[var(--muted-foreground)] transition-colors hover:text-[var(--primary)]">
            查看全部<i data-lucide="chevron-right" class="w-4 h-4"></i>
          </a>
        </div>
        <div class="grid grid-cols-4 gap-2 mt-4">
          <button class="relative flex flex-col items-center gap-2 py-1 transition-transform active:scale-95">
            <span class="absolute top-0 right-3 min-w-[16px] h-4 px-1 inline-flex items-center justify-center rounded-full text-[10px] font-bold leading-none text-[var(--state-error-foreground)] whitespace-nowrap" style="background: var(--destructive);">2</span>
            <i data-lucide="wallet" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">待付款</span>
          </button>
          <button class="relative flex flex-col items-center gap-2 py-1 transition-transform active:scale-95">
            <span class="absolute top-0 right-3 min-w-[16px] h-4 px-1 inline-flex items-center justify-center rounded-full text-[10px] font-bold leading-none text-[var(--state-error-foreground)] whitespace-nowrap" style="background: var(--destructive);">1</span>
            <i data-lucide="gamepad-2" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">进行中</span>
          </button>
          <button class="flex flex-col items-center gap-2 py-1 transition-transform active:scale-95">
            <i data-lucide="star" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">待评价</span>
          </button>
          <button class="flex flex-col items-center gap-2 py-1 transition-transform active:scale-95">
            <i data-lucide="rotate-ccw" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">退款/售后</span>
          </button>
        </div>
      </section>

      <!-- Common functions card -->
      <section class="mx-4 mt-4 bg-[var(--card)] rounded-[var(--radius)] border border-[var(--border)] shadow-[var(--shadow-sm)] p-4">
        <div class="grid grid-cols-4 gap-y-5 gap-x-2">
          <button class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="users" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">我的陪玩</span>
          </button>
          <button data-dom-id="entry-favorite" class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="heart" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">我的收藏</span>
          </button>
          <button data-dom-id="entry-coupon" class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="ticket" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">优惠券</span>
          </button>
          <button class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="map-pin" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">地址管理</span>
          </button>
          <button class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="message-square" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">我的评价</span>
          </button>
          <button class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="user-plus" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">邀请好友</span>
          </button>
          <button class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="message-circle" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">意见反馈</span>
          </button>
          <button data-dom-id="entry-service" class="flex flex-col items-center gap-2 transition-transform active:scale-95">
            <i data-lucide="headphones" class="w-6 h-6 text-[var(--primary)]"></i>
            <span class="text-[12px] text-[var(--foreground)] truncate max-w-full">联系客服</span>
          </button>
        </div>
      </section>

      <!-- Settings menu card -->
      <section class="mx-4 mt-4 bg-[var(--card)] rounded-[var(--radius)] border border-[var(--border)] shadow-[var(--shadow-sm)] px-4 overflow-hidden">
        <button class="w-full flex items-center gap-3 py-3.5 border-b border-[var(--border)] transition-colors active:bg-[var(--muted)]">
          <i data-lucide="shield" class="w-5 h-5 text-[var(--muted-foreground)] shrink-0"></i>
          <span class="flex-1 min-w-0 text-left text-[15px] text-[var(--foreground)] truncate">账户与安全</span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--icon-muted)] shrink-0"></i>
        </button>
        <button class="w-full flex items-center gap-3 py-3.5 border-b border-[var(--border)] transition-colors active:bg-[var(--muted)]">
          <i data-lucide="bell" class="w-5 h-5 text-[var(--muted-foreground)] shrink-0"></i>
          <span class="flex-1 min-w-0 text-left text-[15px] text-[var(--foreground)] truncate">消息通知</span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--icon-muted)] shrink-0"></i>
        </button>
        <button class="w-full flex items-center gap-3 py-3.5 border-b border-[var(--border)] transition-colors active:bg-[var(--muted)]">
          <i data-lucide="lock" class="w-5 h-5 text-[var(--muted-foreground)] shrink-0"></i>
          <span class="flex-1 min-w-0 text-left text-[15px] text-[var(--foreground)] truncate">隐私设置</span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--icon-muted)] shrink-0"></i>
        </button>
        <button class="w-full flex items-center gap-3 py-3.5 border-b border-[var(--border)] transition-colors active:bg-[var(--muted)]">
          <i data-lucide="info" class="w-5 h-5 text-[var(--muted-foreground)] shrink-0"></i>
          <span class="flex-1 min-w-0 text-left text-[15px] text-[var(--foreground)] truncate">关于我们</span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--icon-muted)] shrink-0"></i>
        </button>
        <button data-dom-id="entry-settings" class="w-full flex items-center gap-3 py-3.5 transition-colors active:bg-[var(--muted)]">
          <i data-lucide="settings" class="w-5 h-5 text-[var(--muted-foreground)] shrink-0"></i>
          <span class="flex-1 min-w-0 text-left text-[15px] text-[var(--foreground)] truncate">设置</span>
          <i data-lucide="chevron-right" class="w-5 h-5 text-[var(--icon-muted)] shrink-0"></i>
        </button>
      </section>

      <!-- Bottom TabBar -->
      <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[375px] bg-[var(--card)] border-t border-[var(--border)] z-30">
        <div class="grid grid-cols-3 h-[56px]">
          <a href="./home.html" data-dom-id="nav-tab-home" class="flex flex-col items-center justify-center gap-1 text-[var(--muted-foreground)] transition-colors">
            <i data-lucide="home" class="w-6 h-6"></i>
            <span class="text-[11px]">首页</span>
          </a>
          <a href="./category.html" data-dom-id="nav-tab-category" class="flex flex-col items-center justify-center gap-1 text-[var(--muted-foreground)] transition-colors">
            <i data-lucide="grid" class="w-5 h-5"></i>
            <span class="text-[11px]">分类</span>
          </a>
          <a href="./mine.html" aria-current="page" class="flex flex-col items-center justify-center gap-1 text-[var(--primary)]">
            <i data-lucide="user" class="w-5 h-5"></i>
            <span class="text-[11px] font-semibold">我的</span>
          </a>
        </div>
        <div class="h-[env(safe-area-inset-bottom,0px)]"></div>
      </nav>

    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
