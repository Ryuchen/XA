<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物资对赌单 · 插画确认</title><style>body{max-width:1300px;margin:30px auto;padding:0 24px;background:#fffcf4;color:#213f53;font:18px/1.7 "Microsoft YaHei",sans-serif}img{width:100%}a{color:#197d79}</style><h1>物资对赌单 · 插画确认</h1><p>蜂医携带满载物资箱，灰鼠抱着金条坐在背包上；靶心与撤离落点呼应单局目标挑战。</p><img src="../01-illustrations/challenge-medic-mouse-v1.png" alt="物资对赌单主题插画"><p><a href="../01-illustrations/challenge-medic-mouse-v1.png">透明插画 PNG · 1536×1024</a> · <a href="../01-illustrations/prompts.md">内置 image_gen 提示词</a> · <a href="../02-layouts/layout-plan.md">后续信息规划</a></p><p>已录入4类平台/模式 × 3地图 × 3档，共36档。玩法与房卡补偿由用户确认端手游一致。单局物资严格大于目标才结单，等于也需继续打，不跨局累计。地图以本轮价目为准，不含大坝。</p><p>按照本轮使用的 xingan-gameplay-posters 分阶段流程，插画确认后制作四张价目、横版封面和简洁广告的无字底图，再确认底图并添加矢量文案。</p></html>
